<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VendorBridge</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="description" content="VendorBridge is a full-stack Procurement and Vendor Management ERP for managing vendors, RFQs, quotations, approvals, purchase orders, and invoices." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'sans-serif'], mono: ['DM Mono', 'monospace'] },
          colors: {
            primary: { DEFAULT: '#875A7B', dark: '#6D4A64', light: '#F3EEF2', mid: '#9B6B8E' },
            success: '#00A09D',
            warning: '#F0AD00',
            danger:  '#D9534F',
            surface: '#F0F0F0',
            card:    '#FFFFFF',
            border:  '#DEE2E6',
          }
        }
      }
    }
  </script>
  <style>
    /* ═══════════════════════════════════════════════════
       ODOO-STYLE DESIGN SYSTEM — VendorBridge ERP
       Palette: Purple #875A7B · White sidebar · Clean UI
    ═══════════════════════════════════════════════════ */
    :root {
      --primary:        #875A7B;
      --primary-dark:   #6D4A64;
      --primary-light:  #F3EEF2;
      --primary-mid:    #9B6B8E;

      --success:   #00A09D;
      --warning:   #F0AD00;
      --danger:    #D9534F;
      --info:      #5B9BD5;

      --surface:   #F0F0F0;
      --card:      #FFFFFF;
      --border:    #DEE2E6;
      --border-lt: #EAEAEA;

      --text-primary:   #212529;
      --text-secondary: #6C757D;
      --text-muted:     #9BA5B0;
      --text-purple:    #875A7B;

      --sidebar-width:  210px;
      --header-height:  50px;

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
      --shadow-md: 0 2px 10px rgba(0,0,0,0.10);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.13);
      --shadow-xl: 0 8px 40px rgba(0,0,0,0.16);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary); background: var(--surface); }
    #root { height: 100%; }
    .mono { font-family: 'DM Mono', monospace; }

    /* ── SIDEBAR ─────────────────────────────────────── */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: var(--sidebar-width);
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 50;
      transition: width 220ms cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
    }
    .sidebar.collapsed { width: 52px; }

    .sidebar-logo {
      height: var(--header-height);
      padding: 0 16px;
      border-bottom: 1px solid var(--border-lt);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; flex-shrink: 0;
      user-select: none;
    }
    .sidebar-logo-icon {
      width: 30px; height: 30px; border-radius: 7px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: white; font-weight: 700; font-size: 11px;
      letter-spacing: -0.5px;
    }
    .sidebar-logo-text { color: var(--text-primary); font-size: 14px; font-weight: 700; white-space: nowrap; letter-spacing: -0.3px; }
    .sidebar-logo-sub  { display: none; }

    .sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; overflow-x: hidden; }
    .sidebar-nav::-webkit-scrollbar { width: 0; }

    .nav-section-title {
      padding: 12px 16px 4px;
      color: var(--text-muted); font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.9px; text-transform: uppercase; white-space: nowrap;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      color: var(--text-secondary);
      cursor: pointer; transition: all 120ms ease;
      white-space: nowrap; position: relative;
      font-size: 13px; font-weight: 500;
      border-left: 3px solid transparent;
      min-height: 38px;
    }
    .nav-item:hover { color: var(--primary); background: var(--primary-light); }
    .nav-item.active {
      color: var(--primary);
      background: var(--primary-light);
      border-left-color: var(--primary);
      font-weight: 600;
    }
    .nav-item.active::before { display: none; }
    .nav-item-label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .nav-badge {
      background: var(--danger); color: white;
      font-size: 9px; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; margin-left: auto; flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-lt);
      font-size: 11px; color: var(--text-muted);
      text-align: center; white-space: nowrap;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ── HEADER ─────────────────────────────────────── */
    .header {
      position: fixed; left: var(--sidebar-width); right: 0; top: 0;
      height: var(--header-height);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px; z-index: 40;
      transition: left 220ms cubic-bezier(0.4,0,0.2,1);
    }
    .header.sidebar-collapsed { left: 52px; }

    /* ── MAIN CONTENT ───────────────────────────────── */
    .main-content {
      margin-left: var(--sidebar-width);
      margin-top: var(--header-height);
      padding: 24px;
      min-height: calc(100vh - var(--header-height));
      transition: margin-left 220ms cubic-bezier(0.4,0,0.2,1);
    }
    .main-content.sidebar-collapsed { margin-left: 52px; }

    /* ── CARDS ──────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 6px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-lt);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-body { padding: 18px; }
    .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }

    /* ── METRIC CARDS ───────────────────────────────── */
    .metric-card {
      background: var(--card);
      border-radius: 6px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 18px 20px;
      transition: box-shadow 150ms ease;
    }
    .metric-card:hover { box-shadow: var(--shadow-sm); }
    .metric-value {
      font-size: 28px; font-weight: 700;
      color: var(--text-primary); margin: 6px 0 2px;
      letter-spacing: -0.5px; line-height: 1.1;
    }
    .metric-label {
      font-size: 11px; color: var(--text-muted);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    }
    .metric-change { font-size: 12px; margin-top: 4px; }

    /* ── BUTTONS ─────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 14px;
      border-radius: 4px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent;
      transition: all 140ms ease;
      white-space: nowrap; font-family: 'DM Sans', sans-serif;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; border-color: var(--primary-dark); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }

    .btn-secondary { background: white; color: var(--text-secondary); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface); color: var(--text-primary); border-color: #C0C0C0; }

    .btn-success { background: var(--success); color: white; border-color: #008784; }
    .btn-success:hover:not(:disabled) { background: #008784; }

    .btn-danger  { background: var(--danger); color: white; border-color: #C9302C; }
    .btn-danger:hover:not(:disabled)  { background: #C9302C; }

    .btn-warning { background: var(--warning); color: white; border-color: #E0A000; }
    .btn-warning:hover:not(:disabled) { background: #E0A000; }

    .btn-sm   { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 3px; }
    .btn-icon { width: 30px; height: 30px; padding: 0; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }

    /* ── FORMS ───────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-label .req { color: var(--danger); }

    .form-input {
      height: 36px; border: 1px solid var(--border); border-radius: 4px;
      padding: 0 10px; font-size: 13.5px; font-family: 'DM Sans', sans-serif;
      color: var(--text-primary); background: white;
      transition: border-color 140ms ease, box-shadow 140ms ease;
      outline: none; width: 100%;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(135,90,123,0.12); }
    .form-input.error { border-color: var(--danger); }
    .form-input:disabled { background: #f8f8f8; color: var(--text-muted); cursor: not-allowed; }

    .form-textarea {
      border: 1px solid var(--border); border-radius: 4px;
      padding: 8px 10px; font-size: 13.5px;
      font-family: 'DM Sans', sans-serif; color: var(--text-primary);
      background: white; transition: border-color 140ms ease;
      outline: none; width: 100%; resize: vertical; min-height: 80px;
    }
    .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(135,90,123,0.12); }
    .form-textarea:disabled { background: #f8f8f8; color: var(--text-muted); }

    .form-select {
      height: 36px; border: 1px solid var(--border); border-radius: 4px;
      padding: 0 10px; font-size: 13.5px; font-family: 'DM Sans', sans-serif;
      color: var(--text-primary); background: white;
      cursor: pointer; outline: none; width: 100%;
      transition: border-color 140ms ease;
    }
    .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(135,90,123,0.12); }
    .form-select:disabled { background: #f8f8f8; color: var(--text-muted); }
    .form-error { font-size: 11.5px; color: var(--danger); font-weight: 500; }

    /* ── TABLES ──────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left; padding: 9px 14px;
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border); background: #FAFAFA;
    }
    .data-table td { padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border-lt); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background 100ms ease; }
    .data-table tbody tr:hover td { background: var(--primary-light) !important; }

    /* ── STATUS BADGES ───────────────────────────────── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 3px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }

    .badge-success { background: rgba(0,160,157,0.12); color: #007D7B; }
    .badge-success .badge-dot { background: var(--success); }
    .badge-danger  { background: rgba(217,83,79,0.12);  color: #A03030; }
    .badge-danger  .badge-dot { background: var(--danger); }
    .badge-warning { background: rgba(240,173,0,0.15);  color: #8A6200; }
    .badge-warning .badge-dot { background: var(--warning); }
    .badge-info    { background: rgba(91,155,213,0.15);  color: #3A6EA5; }
    .badge-info    .badge-dot { background: var(--info); }
    .badge-primary { background: var(--primary-light); color: var(--primary); }
    .badge-primary .badge-dot { background: var(--primary); }
    .badge-muted   { background: #F0F0F0; color: var(--text-secondary); }
    .badge-muted   .badge-dot { background: var(--text-muted); }

    /* ── MODALS ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.40); backdrop-filter: blur(1px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 24px; animation: fadeIn 140ms ease;
    }
    .modal {
      background: white; border-radius: 6px;
      box-shadow: var(--shadow-xl);
      max-width: 560px; width: 100%; max-height: 90vh;
      display: flex; flex-direction: column;
      animation: slideUp 180ms ease; border: 1px solid var(--border);
    }
    .modal-lg  { max-width: 760px; }
    .modal-xl  { max-width: 960px; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .modal-title  { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .modal-body   { padding: 18px 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; background: #FAFAFA; border-radius: 0 0 6px 6px; }

    /* ── SLIDE PANEL ─────────────────────────────────── */
    .slide-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; background: white; box-shadow: -4px 0 20px rgba(0,0,0,0.12); z-index: 80; display: flex; flex-direction: column; animation: slideInRight 200ms ease; border-left: 1px solid var(--border); }
    .slide-panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 79; }
    .slide-panel-header  { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .slide-panel-body    { flex: 1; overflow-y: auto; padding: 18px 20px; }

    /* ── TOASTS ──────────────────────────────────────── */
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
    .toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 5px; background: white; box-shadow: var(--shadow-lg); border: 1px solid var(--border); border-left: 4px solid; min-width: 280px; max-width: 380px; animation: slideInRight 220ms ease; }
    .toast-success { border-left-color: var(--success); }
    .toast-error   { border-left-color: var(--danger); }
    .toast-warning { border-left-color: var(--warning); }
    .toast-info    { border-left-color: var(--primary); }
    .toast-message { font-size: 13px; color: var(--text-primary); font-weight: 500; flex: 1; }
    .toast-sub     { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }

    /* ── TABS ────────────────────────────────────────── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
    .tab { padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 130ms ease; }
    .tab:hover  { color: var(--text-primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

    /* ── SEARCH ──────────────────────────────────────── */
    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 34px; }
    .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    /* ── STARS ───────────────────────────────────────── */
    .stars { display: inline-flex; gap: 1px; }
    .star-filled { color: var(--warning); }
    .star-empty  { color: #D1D5DB; }

    /* ── STEP INDICATOR ──────────────────────────────── */
    .steps { display: flex; align-items: center; margin-bottom: 28px; }
    .step  { display: flex; align-items: center; flex: 1; }
    .step-circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .step-circle.done    { background: var(--primary); color: white; }
    .step-circle.active  { background: var(--primary); color: white; box-shadow: 0 0 0 3px var(--primary-light); }
    .step-circle.pending { background: white; color: var(--text-muted); border: 2px solid var(--border); }
    .step-label   { font-size: 11px; font-weight: 500; margin-top: 5px; }
    .step-connector      { flex: 1; height: 2px; background: var(--border); margin: 0 6px; }
    .step-connector.done { background: var(--primary); }

    /* ── SKELETON ────────────────────────────────────── */
    .skeleton { background: linear-gradient(90deg, #F0F0F0 25%, #E4E4E4 50%, #F0F0F0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 3px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── AVATAR ──────────────────────────────────────── */
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }

    /* ── NOTIFICATION DROPDOWN ───────────────────────── */
    .notif-dropdown { position: absolute; right: 0; top: calc(100% + 6px); width: 320px; background: white; border-radius: 6px; box-shadow: var(--shadow-xl); border: 1px solid var(--border); z-index: 60; }
    .notif-item { padding: 10px 14px; display: flex; gap: 10px; border-bottom: 1px solid var(--border-lt); cursor: pointer; transition: background 110ms ease; font-size: 13px; }
    .notif-item:hover { background: var(--surface); }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: var(--primary-light); }

    /* ── PROFILE DROPDOWN ────────────────────────────── */
    .profile-dropdown { position: absolute; right: 0; top: calc(100% + 6px); width: 200px; background: white; border-radius: 6px; box-shadow: var(--shadow-xl); border: 1px solid var(--border); z-index: 60; }
    .profile-dropdown-item { padding: 8px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px; transition: background 110ms ease; }
    .profile-dropdown-item:hover { background: var(--surface); }
    .profile-dropdown-item.danger { color: var(--danger); }

    /* ── EMPTY STATE ─────────────────────────────────── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 52px 20px; text-align: center; }
    .empty-state-icon  { color: var(--text-muted); margin-bottom: 12px; }
    .empty-state-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .empty-state-sub   { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }

    /* ── LOGIN PAGE ──────────────────────────────────── */
    .login-left {
      background: linear-gradient(150deg, #6D4A64 0%, #875A7B 50%, #9B6B8E 100%);
      position: relative; overflow: hidden;
    }
    .login-left::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 70%, rgba(255,255,255,0.08) 0%, transparent 55%);
      pointer-events: none;
    }

    /* ── COMPARISON TABLE ────────────────────────────── */
    .compare-cell-best  { background: rgba(0,160,157,0.08) !important; }
    .compare-cell-worst { background: rgba(217,83,79,0.08)  !important; }

    /* ── COMPARISON VENDOR CARD ──────────────────────── */
    .compare-vendor-card { border: 1px solid var(--border); border-radius: 6px; padding: 14px; transition: all 140ms ease; cursor: pointer; background: white; }
    .compare-vendor-card:hover    { border-color: var(--primary); }
    .compare-vendor-card.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 2px rgba(135,90,123,0.18); }

    /* ── TIMELINE ────────────────────────────────────── */
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border); }
    .timeline-item { position: relative; margin-bottom: 18px; }
    .timeline-dot  { position: absolute; left: -22px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; top: 3px; }
    .timeline-dot.success { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .timeline-dot.danger  { background: var(--danger);  box-shadow: 0 0 0 2px var(--danger); }
    .timeline-dot.primary { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-dot.muted   { background: var(--text-muted); box-shadow: 0 0 0 2px var(--text-muted); }

    /* ── PRINT STYLES ────────────────────────────────── */
    @media print {
      .sidebar, .header, .no-print { display: none !important; }
      .main-content { margin: 0 !important; padding: 0 !important; }
      .print-invoice { max-width: 800px; margin: 0 auto; }
    }

    /* ── ANIMATIONS ──────────────────────────────────── */
    @keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp     { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

      .data-table-wrap, .card > div { overflow-x: auto; -webkit-overflow-scrolling: touch; }

const formatCurrency = (amount) => {
  if (amount === null || amount === undefined) return '—';
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
};

const formatDate = (dateStr) => {
  if (!dateStr) return '—';
  const d = new Date(dateStr.split(' ')[0]);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
};

const formatDateTime = (dtStr) => {
  if (!dtStr) return '—';
  const parts = dtStr.split(' ');
  return `${formatDate(parts[0])}${parts[1] ? ' ' + parts[1] + (parts[2] ? ' ' + parts[2] : '') : ''}`;
};

const timeAgo = (dtStr) => {
  if (!dtStr) return '';
  const now = new Date('2026-06-06');
  const then = new Date(dtStr.split(' ')[0]);
  const diffDays = Math.floor((now - then) / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  if (diffDays < 7) return `${diffDays} days ago`;
  if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
  return `${Math.floor(diffDays / 30)} months ago`;
};

const daysUntil = (dateStr) => {
  if (!dateStr) return null;
  const now = new Date('2026-06-06');
  const then = new Date(dateStr);
  return Math.ceil((then - now) / (1000 * 60 * 60 * 24));
};

const generateId = (prefix) => `${prefix}${Date.now()}${Math.floor(Math.random() * 1000)}`;

const generateRFQNumber = (count) => `RFQ-2026-${String(count).padStart(4, '0')}`;

const generatePONumber = (count) => `PO-2026-${String(count).padStart(4, '0')}`;

const generateInvoiceNumber = (count) => `INV-2026-${String(count).padStart(4, '0')}`;

const generateApprovalId = (count) => `AP-2026-${String(count).padStart(4, '0')}`;

const getAvatarColor = (name) => {
  const colors = ['#1B4FD8','#0EA5E9','#16A34A','#D97706','#DC2626','#7C3AED','#DB2777','#0891B2'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
};

const getInitials = (name) => {
  if (!name) return '?';
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
};

const getStatusBadgeClass = (status) => {

    'Delivered': 'badge-success', 'Accepted': 'badge-success', 'Closed': 'badge-success',

    'Approval Pending': 'badge-warning',

    'Rejected': 'badge-danger', 'Blacklisted': 'badge-danger', 'Overdue': 'badge-danger',

const calculateGST = (subtotal, gstRate, isInterstate = false) => {
  const gstAmount = (subtotal * gstRate) / 100;
  if (isInterstate) return { cgst: 0, sgst: 0, igst: gstAmount, total: gstAmount };
  return { cgst: gstAmount / 2, sgst: gstAmount / 2, igst: 0, total: gstAmount };
};

const validateGST = (gst) => /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/.test(gst);

const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

const validatePhone = (phone) => /^[6-9]\d{9}$/.test(phone);

const debounce = (fn, delay) => {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
};

const exportToCSV = (data, columns, filename) => {
  const header = columns.map(c => c.label).join(',');
  const rows = data.map(row => columns.map(c => {
    const val = typeof c.value === 'function' ? c.value(row) : row[c.key] || '';
    return `"${String(val).replace(/"/g, '""')}"`;
  }).join(','));
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filename}.csv`;
  a.click(); URL.revokeObjectURL(url);
};

const Stars = ({ rating, max = 5 }) => {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5;
  return (
    <div className="rating-stars">
      {Array.from({ length: max }).map((_, i) => (
        <span key={i} style={{ fontSize: 14, color: i < full ? '#F59E0B' : (i === full && half ? '#F59E0B' : '#D1D5DB') }}>
          {i < full ? '★' : (i === full && half ? '★' : '☆')}
        </span>
      ))}
    </div>
  );
};

// APP CONTEXT
// ═══════════════════════════════════════════════════

const AppContext = createContext(null);

// ═══════════════════════════════════════════════════
// STORAGE — single key, single save, nothing missed
// ═══════════════════════════════════════════════════
const STORAGE_KEY  = 'vendorbridge_data';
const SESSION_KEY  = 'vendorbridge_session';

const loadState = () => {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : null;
  } catch { return null; }
};

const saveState = (state) => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch { console.warn('Could not save state'); }
};

// ── SEED_DATA bundles all initial data ───────────────────────────────────────
const SEED_DATA = {
  users:         INITIAL_USERS,
  vendors:       INITIAL_VENDORS,
  rfqs:          INITIAL_RFQS,
  quotations:    INITIAL_QUOTATIONS,
  approvals:     INITIAL_APPROVALS,
  pos:           INITIAL_POS,
  invoices:      INITIAL_INVOICES,
  logs:          INITIAL_LOGS,
  notifications: INITIAL_NOTIFICATIONS,
};

// ── REDUCER — every mutation goes through here ────────────────────────────────
const appReducer = (state, action) => {
  const apply = (key, updater) => ({
    ...state,
    [key]: typeof updater === 'function' ? updater(state[key]) : updater,
  });
  switch (action.type) {
    case 'SET_USERS':         return apply('users',         action.payload);
    case 'SET_VENDORS':       return apply('vendors',       action.payload);
    case 'SET_RFQS':          return apply('rfqs',          action.payload);
    case 'SET_QUOTATIONS':    return apply('quotations',    action.payload);
    case 'SET_APPROVALS':     return apply('approvals',     action.payload);
    case 'SET_POS':           return apply('pos',           action.payload);
    case 'SET_INVOICES':      return apply('invoices',      action.payload);
    case 'SET_LOGS':          return apply('logs',          action.payload);
    case 'SET_NOTIFICATIONS': return apply('notifications', action.payload);
    case 'RESET':             return { ...SEED_DATA };
    default: return state;
  }
};

// ═══════════════════════════════════════════════════
// APP PROVIDER
// ═══════════════════════════════════════════════════
const AppProvider = ({ children }) => {
  // ── Load persisted data OR seed on first run ─────────────────────────────
  const [state, dispatch] = useReducer(appReducer, null, () => loadState() || SEED_DATA);

  // ── Session: auto-login from localStorage ────────────────────────────────
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const s = localStorage.getItem(SESSION_KEY);
      return s ? JSON.parse(s) : null;
    } catch { return null; }
  });

  // UI-only state (not persisted)
  const [toasts,      setToasts]      = useState([]);
  const [currentPage, setCurrentPage] = useState('dashboard');

  // ── Single useEffect saves ALL state on every change ─────────────────────
  useEffect(() => { saveState(state); }, [state]);

  // ── Convenience action creators (keep same API for all components) ────────
  const setUsers         = useCallback(u => dispatch({ type: 'SET_USERS',         payload: u }), []);
  const setVendors       = useCallback(u => dispatch({ type: 'SET_VENDORS',       payload: u }), []);
  const setRfqs          = useCallback(u => dispatch({ type: 'SET_RFQS',          payload: u }), []);
  const setQuotations    = useCallback(u => dispatch({ type: 'SET_QUOTATIONS',    payload: u }), []);
  const setApprovals     = useCallback(u => dispatch({ type: 'SET_APPROVALS',     payload: u }), []);
  const setPos           = useCallback(u => dispatch({ type: 'SET_POS',           payload: u }), []);
  const setInvoices      = useCallback(u => dispatch({ type: 'SET_INVOICES',      payload: u }), []);
  const setLogs          = useCallback(u => dispatch({ type: 'SET_LOGS',          payload: u }), []);
  const setNotifications = useCallback(u => dispatch({ type: 'SET_NOTIFICATIONS', payload: u }), []);

  // ── Domain helpers ────────────────────────────────────────────────────────
  const addLog = useCallback((action, entityType, entityId, details) => {
    const entry = {
      id: generateId('log'),
      timestamp: new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
      userId:   currentUser?.id   || 'system',
      userName: currentUser?.name || 'System',
      action, entityType, entityId, details,
    };
    dispatch({ type: 'SET_LOGS', payload: prev => [entry, ...prev] });
  }, [currentUser]);

  const addNotification = useCallback((type, message, userId) => {
    const notif = {
      id: generateId('n'), type, message,
      time: new Date().toLocaleString('en-IN'),
      read: false, userId: userId || currentUser?.id,
    };
    dispatch({ type: 'SET_NOTIFICATIONS', payload: prev => [notif, ...prev] });
  }, [currentUser]);

  const showToast = useCallback((message, type = 'success', sub = '') => {
    const id = generateId('t');
    setToasts(prev => [...prev, { id, message, type, sub }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  }, []);

  // usersRef always points to latest users — avoids stale closure in login
  const usersRef = useRef(state.users);
  useEffect(() => { usersRef.current = state.users; }, [state.users]);

  const login = useCallback((email, password) => {
    const user = usersRef.current.find(u => u.email === email && u.password === password);
    if (!user) return false;
    setCurrentUser(user);
    localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    return user;
  }, []);

  const logout = useCallback(() => {
    setCurrentUser(null);
    localStorage.removeItem(SESSION_KEY);
    setCurrentPage('dashboard');
  }, []);

  const signup = useCallback((data) => {
    if (state.users.find(u => u.email === data.email)) return { error: 'Email already registered' };
    const newUser = {
      id: generateId('u'), ...data,
      createdAt: new Date().toISOString().split('T')[0],
    };
    dispatch({ type: 'SET_USERS', payload: prev => [...prev, newUser] });
    // If signing up as Vendor, auto-create a vendor record and link vendorId
    if (data.role === ROLES.VENDOR) {
      const newVendor = {
        id: generateId('v'), name: data.name,
        category: 'Services', gst: '', pan: '',
        contactPerson: data.name, email: data.email,
        phone: data.phone || '', address: '',
        bankAccount: '', ifsc: '',
        status: 'Active', rating: 3.0,
        createdAt: new Date().toISOString().split('T')[0],
      };
      dispatch({ type: 'SET_VENDORS', payload: prev => [...prev, newVendor] });
      newUser.vendorId = newVendor.id;
      // Re-dispatch user update with vendorId
      dispatch({ type: 'SET_USERS', payload: prev => prev.map(u => u.id === newUser.id ? { ...u, vendorId: newVendor.id } : u) });
    }
    // Auto-login the new user immediately — no stale closure, uses newUser directly
    setCurrentUser(newUser);
    localStorage.setItem(SESSION_KEY, JSON.stringify(newUser));
    return { success: true, user: newUser };
  }, [state.users]);

  const markAllRead = useCallback(() => {
    dispatch({ type: 'SET_NOTIFICATIONS', payload: prev =>
      prev.map(n => n.userId === currentUser?.id ? { ...n, read: true } : n)
    });
  }, [currentUser]);

  const userNotifications = useMemo(() =>
    state.notifications.filter(n => !n.userId || n.userId === currentUser?.id),
    [state.notifications, currentUser]);

  const unreadCount = useMemo(() =>
    userNotifications.filter(n => !n.read).length,
    [userNotifications]);

  const pendingApprovalsCount = useMemo(() =>
    state.approvals.filter(a => a.status === 'Pending').length,
    [state.approvals]);

  return (
    <AppContext.Provider value={{
      // state slices
      users:         state.users,
      vendors:       state.vendors,
      rfqs:          state.rfqs,
      quotations:    state.quotations,
      approvals:     state.approvals,
      pos:           state.pos,
      invoices:      state.invoices,
      logs:          state.logs,
      notifications: state.notifications,
      // setters (dispatch-backed)
      setUsers, setVendors, setRfqs, setQuotations,
      setApprovals, setPos, setInvoices, setLogs, setNotifications,
      // auth
      currentUser, login, logout, signup,
      // helpers
      addLog, addNotification, showToast, markAllRead,
      userNotifications, unreadCount, pendingApprovalsCount,
      // ui
      toasts, currentPage, setCurrentPage,
      // reset (Admin only)
      resetToSeed: () => {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(SESSION_KEY);
        window.location.reload();
      },
    }}>
      {children}
    </AppContext.Provider>
  );
};

const useApp = () => useContext(AppContext);

// Toast System
const ToastContainer = () => {
  const { toasts } = useApp();
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  const colors = { success: '#16A34A', error: '#DC2626', warning: '#D97706', info: '#0EA5E9' };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast toast-${t.type}`}>
          <div style={{ width: 20, height: 20, borderRadius: '50%', background: colors[t.type], color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{icons[t.type]}</div>
          <div>
            <div className="toast-message">{t.message}</div>
            {t.sub && <div className="toast-sub">{t.sub}</div>}
          </div>
        </div>
      ))}
    </div>
  );
};

// Confirm Dialog
const ConfirmDialog = ({ open, title, message, icon, confirmLabel = 'Confirm', confirmClass = 'btn-primary', onConfirm, onCancel, children }) => {
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onCancel?.(); };
    if (open) document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [open, onCancel]);
  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
        <div className="modal-body" style={{ textAlign: 'center', padding: '32px 24px 20px' }}>
          {icon && (
            <div style={{ marginBottom: 16, display:'flex', alignItems:'center', justifyContent:'center' }}>
              {typeof icon === 'string' && ['approve','reject','activate','deactivate','deliver','pay','invoice_gen','send','warning_tri','export_csv'].includes(icon)
                ? <div style={{ width:56, height:56, borderRadius:14, background:'var(--primary-light)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--primary)' }}><Icon name={icon} size={26} /></div>
                : <div style={{ fontSize: 40 }}>{icon}</div>
              }
            </div>
          )}
          <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>{title}</div>
          <div style={{ fontSize: 14, color: 'var(--text-secondary)', lineHeight: 1.6 }}>{message}</div>
          {children}
        </div>
        <div className="modal-footer" style={{ justifyContent: 'center', gap: 12 }}>
          <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          <button className={`btn ${confirmClass}`} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
};

// Status Badge
const StatusBadge = ({ status }) => {
  const cls = getStatusBadgeClass(status);
  return (
    <span className={`badge ${cls}`}>
      <span className="badge-dot"></span>
      {status}
    </span>
  );
};

// Metric Card

  <div className="metric-card">
    <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.8px', marginBottom: 6 }}>{label}</div>
        <div style={{ fontSize: isLarge ? 22 : 28, fontWeight: 700, color: 'var(--text-primary)', letterSpacing: '-0.5px', lineHeight: 1.1 }}>{value}</div>
        {sub && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>{sub}</div>}
      </div>
      {icon && (
        <div style={{ width: 42, height: 42, borderRadius: 8, background: iconBg || 'var(--primary-light)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: iconColor || 'var(--primary)', flexShrink: 0 }}>
          <Icon name={icon} size={20} />
        </div>
      )}
    </div>

      <div style={{ fontSize: 11.5, marginTop: 8, color: changePct >= 0 ? 'var(--success)' : 'var(--danger)', fontWeight: 500 }}>
        <span>{changePct >= 0 ? '↑' : '↓'} {Math.abs(changePct)}%</span>
        <span style={{ color: 'var(--text-muted)', fontWeight: 400, marginLeft: 4 }}>{change || 'vs last month'}</span>
      </div>
    )}
  </div>
);
