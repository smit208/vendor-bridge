              </table>
            </div>
            {errors.lineItems && <div style={{ padding: '8px 14px', color: '#DC2626', fontSize: 13 }}>{errors.lineItems}</div>}
          </div>

          {/* Terms */}
          <div className="card card-body">
            <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 16 }}>Quotation Terms</div>
            <div className="grid-2" style={{ gap: 16 }}>
              <div className="form-group">
                <label className="form-label">Delivery Date <span className="req">*</span></label>
                <input className={`form-input${errors.deliveryDate ? ' error' : ''}`} type="date" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} disabled={existingQuote && !canEdit} />
                {errors.deliveryDate && <span className="form-error">{errors.deliveryDate}</span>}
              </div>
              <div className="form-group">
                <label className="form-label">Payment Terms</label>
                <select className="form-select" value={paymentTerms} onChange={e => setPaymentTerms(e.target.value)} disabled={existingQuote && !canEdit}>
                  {PAYMENT_TERMS.map(t => <option key={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">GST Rate (%)</label>
                <select className="form-select" value={gstRate} onChange={e => setGstRate(e.target.value)} disabled={existingQuote && !canEdit}>
                  {GST_RATES.map(r => <option key={r} value={r}>{r}%</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Validity Period</label>
                <select className="form-select" value={validityPeriod} onChange={e => setValidityPeriod(e.target.value)} disabled={existingQuote && !canEdit}>
                  {VALIDITY_PERIODS.map(v => <option key={v}>{v}</option>)}
                </select>
              </div>
              <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                <label className="form-label">Notes / Comments</label>
                <textarea className="form-textarea" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Any additional terms, conditions, or notes for the buyer..." rows={3} disabled={existingQuote && !canEdit} />
              </div>
            </div>
          </div>
        </div>

        {/* Summary sidebar */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="card card-body" style={{ position: 'sticky', top: 80 }}>
            <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 16 }}>Quotation Summary</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
                <span style={{ color: 'var(--text-secondary)' }}>Subtotal</span>
                <span className="mono" style={{ fontWeight: 500 }}>{formatCurrency(subtotal)}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
                <span style={{ color: 'var(--text-secondary)' }}>GST ({gstRate}%)</span>
                <span className="mono">{formatCurrency(gstAmount)}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
                <span style={{ color: 'var(--text-secondary)' }}>CGST ({Number(gstRate)/2}%)</span>
                <span className="mono">{formatCurrency(gstAmount / 2)}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
                <span style={{ color: 'var(--text-secondary)' }}>SGST ({Number(gstRate)/2}%)</span>
                <span className="mono">{formatCurrency(gstAmount / 2)}</span>
              </div>
              <div style={{ height: 1, background: 'var(--border)', margin: '4px 0' }}></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontWeight: 600, fontSize: 14 }}>Grand Total</span>
                <span className="mono" style={{ fontWeight: 600, fontSize: 20, color: 'var(--primary)' }}>{formatCurrency(grandTotal)}</span>
              </div>
            </div>
            {(canEdit || !existingQuote) && (
              <div style={{ marginTop: 20, display: 'flex', flexDirection: 'column', gap: 10 }}>
                <button className="btn btn-primary" style={{ height: 42 }} onClick={() => setConfirmSubmit(true)} disabled={saving}>
                  {saving ? <><div className="spinner"></div>&nbsp;Submitting...</> : existingQuote ? 'Update Quotation' : 'Submit Quotation'}
                </button>
              </div>
            )}
            {existingQuote && (
              <div style={{ marginTop: 16, padding: '10px 12px', background: 'var(--surface)', borderRadius: 6, border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 500, marginBottom: 4 }}>Submitted At</div>
                <div style={{ fontSize: 13 }}>{existingQuote.submittedAt}</div>
              </div>
            )}
          </div>
        </div>
      </div>

      <ConfirmDialog open={confirmSubmit} title="Submit Quotation?" message="Once submitted, the buyer will be notified. You can edit this quotation only while the RFQ is still open." icon="approve" confirmLabel="Submit Quotation" confirmClass="btn-primary" onConfirm={() => saveQuotation(false)} onCancel={() => setConfirmSubmit(false)} />
    </div>
  );
};

const MyQuotations = () => {
  const { quotations, rfqs, currentUser, vendors } = useApp();
  const myVendorId = currentUser?.vendorId;
  const myQuotes = myVendorId ? quotations.filter(q => q.vendorId === myVendorId) : [];

  const columns = [
    { key: 'rfq', label: 'RFQ', render: q => { const rfq = rfqs.find(r => r.id === q.rfqId); return <div><span className="mono" style={{ color: 'var(--primary)', fontSize: 13 }}>{rfq?.rfqNumber}</span><div style={{ fontSize: 13, fontWeight: 500, marginTop: 2 }}>{rfq?.title}</div></div>; } },
    { key: 'subtotal', label: 'Subtotal', render: q => <span className="mono">{formatCurrency(q.subtotal)}</span> },
    { key: 'gst', label: 'GST', render: q => <span>{q.gstRate}% ({formatCurrency(q.gstAmount)})</span> },
    { key: 'grandTotal', label: 'Grand Total', render: q => <span className="mono" style={{ fontWeight: 600, color: 'var(--primary)' }}>{formatCurrency(q.grandTotal)}</span> },

const QuotationsList = () => {
  const { quotations, rfqs, vendors } = useApp();
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [loading, setLoading] = useState(true);
  useEffect(() => { setTimeout(() => setLoading(false), 500); }, []);

  const filtered = useMemo(() => quotations.filter(q => {
    const rfq = rfqs.find(r => r.id === q.rfqId);
    const s = search.toLowerCase();
    const matchSearch = !s || q.vendorName?.toLowerCase().includes(s) || rfq?.rfqNumber?.toLowerCase().includes(s) || rfq?.title?.toLowerCase().includes(s);
    const matchStatus = !filterStatus || q.status === filterStatus;
    return matchSearch && matchStatus;
  }), [quotations, rfqs, search, filterStatus]);

  const columns = [
    { key: 'rfq', label: 'RFQ', render: q => { const rfq = rfqs.find(r => r.id === q.rfqId); return <div><span className="mono" style={{ color: 'var(--primary)', fontSize: 12 }}>{rfq?.rfqNumber}</span><div style={{ fontWeight: 500, fontSize: 13, marginTop: 2 }}>{rfq?.title}</div></div>; } },
    { key: 'vendorName', label: 'Vendor', render: q => <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Avatar name={q.vendorName} size={26} />{q.vendorName}</div> },
    { key: 'grandTotal', label: 'Grand Total', render: q => <span className="mono" style={{ fontWeight: 600, color: 'var(--primary)' }}>{formatCurrency(q.grandTotal)}</span> },
    { key: 'gstRate', label: 'GST', render: q => `${q.gstRate}%` },
    { key: 'deliveryDate', label: 'Delivery Date', render: q => formatDate(q.deliveryDate) },
    { key: 'paymentTerms', label: 'Payment Terms' },
    { key: 'validityPeriod', label: 'Validity' },
    { key: 'status', label: 'Status', render: q => <StatusBadge status={q.status} /> },
    { key: 'submittedAt', label: 'Submitted', render: q => <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{q.submittedAt}</span> },
  ];

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Quotations</h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>All vendor quotations across all RFQs</p>
      </div>
      <div className="card">
        <div className="card-body" style={{ paddingBottom: 0 }}>
          <div className="filter-bar">
            <div className="search-wrap" style={{ flex: 1, maxWidth: 320 }}>
              <span className="search-icon" style={{ display:"flex", alignItems:"center", color:"var(--text-muted)" }}><Icon name="search" size={14} /></span>
              <input className="form-input" placeholder="Search quotations..." value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 36 }} />
            </div>
            <select className="form-select" style={{ width: 160 }} value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All Status</option>
              {['Submitted','Selected','Rejected'].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <DataTable columns={columns} data={filtered} loading={loading} emptyTitle="No quotations" emptySub="No vendor quotations have been submitted yet." />
      </div>
    </div>
  );
};

const QuotationComparison = () => {
  const { rfqs, quotations, vendors, approvals, setApprovals, setRfqs, setQuotations, showToast, addLog, addNotification, currentUser, setCurrentPage } = useApp();
  const [selectedRfqId, setSelectedRfqId] = useState('');
  const [selectedVendorId, setSelectedVendorId] = useState(null);
  const [confirmSelect, setConfirmSelect] = useState(false);
  const [saving, setSaving] = useState(false);

  // ── Statuses that disqualify an RFQ from the comparison page ────────────
  const EXCLUDED_STATUSES = [
    'Approval Pending', 'Under Review', 'Approved', 'Rejected',
    'Closed', 'PO Generated', 'Invoice Generated', 'Draft',
  ];

  // Only show RFQs that: have ≥1 active quotation AND are not already in the approval pipeline
  const comparableRfqs = rfqs.filter(r => {
    if (EXCLUDED_STATUSES.includes(r.status)) return false;
    return quotations.some(q => q.rfqId === r.id && q.status !== 'Rejected');
  });

  const rfq      = rfqs.find(r => r.id === selectedRfqId);
  const rfqQuotes = rfq
    ? quotations.filter(q => q.rfqId === rfq.id && q.status !== 'Rejected')
    : [];

  // Auto-clear selection when the chosen RFQ disappears from the eligible list
  useEffect(() => {
    if (selectedRfqId && !comparableRfqs.find(r => r.id === selectedRfqId)) {
      setSelectedRfqId('');
      setSelectedVendorId(null);
    }
  }, [comparableRfqs.length, selectedRfqId]);

  const getMin = (field, arr) => { const v = arr.map(q => q[field]).filter(x => x != null); return v.length ? Math.min(...v) : null; };
  const getMax = (field, arr) => { const v = arr.map(q => q[field]).filter(x => x != null); return v.length ? Math.max(...v) : null; };

  const minTotal = getMin('grandTotal', rfqQuotes);
  const maxTotal = getMax('grandTotal', rfqQuotes);

  // ── SEND FOR APPROVAL ────────────────────────────────────────────────────
  const selectVendor = async () => {
    if (!selectedVendorId || !rfq) return;
    setSaving(true);
    await new Promise(r => setTimeout(r, 600));

    const vendor = vendors.find(v => v.id === selectedVendorId);
    const quote  = rfqQuotes.find(q => q.vendorId === selectedVendorId);
    if (!quote) {
      setSaving(false);
      showToast('Quotation not found. Please refresh and try again.', 'error');
      return;
    }

    // 1 ─ Create pending approval record
    const newApproval = {
      id:           generateId('ap'),
      rfqId:        rfq.id,
      rfqNumber:    rfq.rfqNumber,
      quotationId:  quote.id,
      vendorId:     selectedVendorId,
      vendorName:   vendor?.name || '',
      totalAmount:  quote.grandTotal,
      requestedBy:  currentUser.id,
      requestedAt:  new Date().toLocaleString('en-IN'),
