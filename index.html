  const quickActions = [
    { icon: 'qa_add',     label: 'Add Vendor',          page: 'vendors'    },
    { icon: 'qa_rfq',     label: 'Create RFQ',           page: 'rfqs'       },
    { icon: 'qa_compare', label: 'Compare Quotations',   page: 'comparison' },
    { icon: 'qa_approval',label: 'Pending Approvals',    page: 'approvals'  },
    { icon: 'qa_invoice', label: 'Generate Invoice',     page: 'invoices'   },
  ];

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 3, color: 'var(--text-primary)', letterSpacing: '-0.3px' }}>Dashboard</h2>
        <p style={{ color: 'var(--text-muted)', fontSize: 13 }}>Procurement overview &amp; quick actions</p>
      </div>

      {/* ── Metric Grid ── */}
      <div className="grid-4" style={{ marginBottom: 20 }}>
        <MetricCard label="TOTAL VENDORS"   value={vendors.length}   icon="ic_vendors"   iconColor="#875A7B" iconBg="#F3EEF2" />
        <MetricCard label="ACTIVE RFQS"     value={myRfqs.length}    icon="ic_rfq"       iconColor="#5B9BD5" iconBg="#EBF5FF" />
        <MetricCard label="QUOTATIONS"      value={quotations.length} icon="ic_quotation" iconColor="#D9534F" iconBg="#FDECEA" />
        <MetricCard label="PENDING APPROVALS" value={pendingApprovals} icon="ic_approval" iconColor="#F0AD00" iconBg="#FFF8E1" />
      </div>
      <div className="grid-4" style={{ marginBottom: 24 }}>
        <MetricCard label="PURCHASE ORDERS" value={approvedPos}      icon="ic_po"        iconColor="#00A09D" iconBg="#E6F7F7" />
        <MetricCard label="INVOICES"        value={invoicesSent}     icon="ic_invoice"   iconColor="#5B9BD5" iconBg="#EBF5FF" />
        <MetricCard label="MONTHLY SPEND"   value={monthlySpend >= 100000 ? '₹' + (monthlySpend/100000).toFixed(1) + 'L' : '₹' + monthlySpend.toLocaleString('en-IN')} icon="ic_spend" iconColor="#F0AD00" iconBg="#FFF8E1" isLarge />
        <MetricCard label="ACTIVE VENDORS"  value={activeVendors}   icon="ic_vendors"   iconColor="#00A09D" iconBg="#E6F7F7" />
      </div>

      {/* ── Bottom Row ── */}
      <div style={{ display: 'grid', gridTemplateColumns: '420px 1fr', gap: 20 }}>
        {/* Quick Actions */}
        <div className="card">
          <div className="card-header"><span className="card-title">Quick Actions</span></div>
          <div style={{ padding: '8px 0' }}>
            {quickActions.map((qa, i) => (
              <div key={i} onClick={() => setCurrentPage(qa.page)}
                style={{ display:'flex', alignItems:'center', gap:14, padding:'11px 18px', cursor:'pointer', borderBottom: i < quickActions.length-1 ? '1px solid var(--border-lt)' : 'none', transition:'background 120ms ease' }}
                onMouseEnter={e => e.currentTarget.style.background='var(--primary-light)'}
                onMouseLeave={e => e.currentTarget.style.background=''}
              >
                <span style={{ width:32, height:32, borderRadius:6, background:'var(--surface)', border:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-secondary)', flexShrink:0 }}>
                  <Icon name={qa.icon} size={15} />
                </span>
                <span style={{ flex:1, fontSize:13.5, fontWeight:500, color:'var(--text-primary)' }}>{qa.label}</span>
                <span style={{ color:'var(--text-muted)' }}><Icon name="arrow_right" size={14} /></span>
              </div>
            ))}
          </div>
        </div>

        {/* Recent Activity — LIVE from logs */}
        <div className="card">
          <div className="card-header">
            <span className="card-title">Recent Activity</span>
            <span style={{ fontSize:12, color:'var(--text-muted)' }}>{logs.length} total events</span>
          </div>
          <LiveActivityFeed logs={logs} limit={6} />
        </div>
      </div>
    </div>
  );
};

const ManagerDashboard = () => {
  const { approvals, rfqs, setCurrentPage } = useApp();
  const pending = approvals.filter(a => a.status === 'Pending');
  const approvedThisWeek = approvals.filter(a => a.status === 'Approved').length;
  const rejectedThisWeek = approvals.filter(a => a.status === 'Rejected').length;

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Approval Dashboard</h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>Manage and track procurement approvals</p>
      </div>
      <div className="grid-4" style={{ marginBottom: 24 }}>
        <MetricCard label="PENDING APPROVALS" value={pending.length} icon="ic_time" iconColor="#F0AD00" iconBg="#FFF8E1" />
        <MetricCard label="APPROVED THIS MONTH" value={approvedThisWeek} icon="ic_check" iconColor="#00A09D" iconBg="#E6F7F7" />
        <MetricCard label="REJECTED THIS MONTH" value={rejectedThisWeek} icon="ic_x" iconColor="#D9534F" iconBg="#FDECEA" />
        <MetricCard label="AVG APPROVAL TIME" value="1.2 days" icon="ic_trend" iconColor="#875A7B" iconBg="#F3EEF2" />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 20 }}>
        <div className="card">
          <div className="card-header">
            <span className="card-title">Pending Approvals</span>
            {pending.length > 0 && <span className="badge badge-warning"><span className="badge-dot"></span>{pending.length} pending</span>}
          </div>
          {pending.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon"><Icon name="ic_check" size={40} /></div><div className="empty-state-title">No pending approvals</div><div className="empty-state-sub">All caught up! No approvals waiting for review.</div></div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="data-table">
                <thead><tr><th>RFQ</th><th>Vendor</th><th>Amount</th><th>Requested</th><th>Action</th></tr></thead>
                <tbody>
                  {pending.map(ap => {
                    const rfq = rfqs.find(r => r.id === ap.rfqId);
                    return (
                      <tr key={ap.id}>
                        <td><span className="mono" style={{ color: 'var(--primary)' }}>{rfq?.rfqNumber}</span><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{rfq?.title}</div></td>
                        <td>{ap.vendorName}</td>
                        <td><span className="mono" style={{ fontWeight: 500 }}>{formatCurrency(ap.totalAmount)}</span></td>
                        <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>{timeAgo(ap.requestedAt)}</td>
                        <td><button className="btn btn-sm btn-primary" onClick={() => setCurrentPage('approvals')}>Review</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Quick Actions</span></div>
          <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <QuickAction icon="qa_approval" label="Review Pending" color="#1B4FD8" onClick={() => setCurrentPage('approvals')} />
            <QuickAction icon="qa_po" label="View All POs" color="#16A34A" onClick={() => setCurrentPage('pos')} />
            <QuickAction icon="qa_report" label="View Reports" color="#D97706" onClick={() => setCurrentPage('reports')} />
          </div>
        </div>
      </div>
    </div>
  );
};

const VendorDashboard = () => {
  const { currentUser, rfqs, quotations, pos, invoices, setCurrentPage, vendors } = useApp();
  const myVendorId = currentUser?.vendorId;
  const myRfqs = myVendorId ? rfqs.filter(r => r.vendors?.includes(myVendorId) && r.status !== 'Draft') : [];
  const myQuotes = quotations.filter(q => q.vendorId === myVendorId);
  const myPos = pos.filter(p => p.vendorId === myVendorId);
  const myInvoices = invoices.filter(i => i.vendorId === myVendorId);

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Vendor Portal</h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>Manage your quotations and procurement activities</p>
      </div>
      <div className="grid-4" style={{ marginBottom: 24 }}>
        <MetricCard label="OPEN RFQS" value={myRfqs.filter(r => r.status === 'Sent').length} icon="ic_rfq" iconColor="#875A7B" iconBg="#F3EEF2" />
        <MetricCard label="QUOTES SUBMITTED" value={myQuotes.length} icon="ic_quotation" iconColor="#5B9BD5" iconBg="#EBF5FF" />
        <MetricCard label="POs RECEIVED" value={myPos.length} icon="ic_po" iconColor="#00A09D" iconBg="#E6F7F7" />
        <MetricCard label="INVOICES" value={myInvoices.length} icon="ic_invoice" iconColor="#F0AD00" iconBg="#FFF8E1" />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
        <div className="card">
          <div className="card-header"><span className="card-title">Open RFQs Assigned to Me</span></div>
          {myRfqs.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon"><Icon name="rfqs" size={40} /></div><div className="empty-state-title">No RFQs assigned</div><div className="empty-state-sub">You have no open RFQs at the moment.</div></div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="data-table">
                <thead><tr><th>RFQ</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  {myRfqs.map(rfq => {
                    const days = daysUntil(rfq.deadline);
                    const myQuote = myQuotes.find(q => q.rfqId === rfq.id);
                    return (
                      <tr key={rfq.id}>
                        <td><div style={{ fontWeight: 500 }}>{rfq.rfqNumber}</div><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{rfq.title}</div></td>
                        <td><span className={days !== null && days < 3 ? 'deadline-urgent' : days !== null && days < 7 ? 'deadline-warning' : ''} style={{ fontSize: 13 }}>{formatDate(rfq.deadline)}{days !== null && <div style={{ fontSize: 11 }}>{days > 0 ? `${days} days left` : 'Overdue'}</div>}</span></td>
                        <td><StatusBadge status={myQuote ? myQuote.status : 'Not Submitted'} /></td>
                        <td>
                          {!myQuote ? <button className="btn btn-sm btn-primary" onClick={() => setCurrentPage('vendor-rfqs')}>Submit Quote</button>
                            : <button className="btn btn-sm btn-secondary" onClick={() => setCurrentPage('my-quotations')}>View Quote</button>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">My Recent Quotations</span></div>
          {myQuotes.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon"><Icon name="quotations" size={40} /></div><div className="empty-state-title">No quotations yet</div><div className="empty-state-sub">Submit your first quotation for an open RFQ.</div><button className="btn btn-primary btn-sm" onClick={() => setCurrentPage('vendor-rfqs')}>Browse RFQs</button></div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="data-table">
                <thead><tr><th>RFQ</th><th>Total</th><th>Status</th><th>Submitted</th></tr></thead>
                <tbody>
                  {myQuotes.map(q => (
                    <tr key={q.id}>
                      <td><span className="mono" style={{ color: 'var(--primary)', fontSize: 12 }}>{rfqs.find(r => r.id === q.rfqId)?.rfqNumber}</span></td>
                      <td><span className="mono" style={{ fontWeight: 500 }}>{formatCurrency(q.grandTotal)}</span></td>
                      <td><StatusBadge status={q.status} /></td>
                      <td style={{ fontSize: 12, color: 'var(--text-muted)' }}>{timeAgo(q.submittedAt)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const Dashboard = () => {
  const { currentUser } = useApp();
  if (currentUser?.role === ROLES.ADMIN) return <AdminDashboard />;
  if (currentUser?.role === ROLES.OFFICER) return <OfficerDashboard />;
  if (currentUser?.role === ROLES.MANAGER) return <ManagerDashboard />;
  if (currentUser?.role === ROLES.VENDOR) return <VendorDashboard />;
  return null;
};


// ═══════════════════════════════════════════════════
// VENDOR MANAGEMENT SCREEN
// ═══════════════════════════════════════════════════

const VendorManagement = () => {
  const { vendors, setVendors, showToast, addLog, setCurrentPage } = useApp();
  const [search, setSearch] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [editVendor, setEditVendor] = useState(null);
  const [panelVendor, setPanelVendor] = useState(null);
  const [panelTab, setPanelTab] = useState('details');
  const [loading, setLoading] = useState(true);
  const [confirmToggle, setConfirmToggle] = useState(null);
  const [form, setForm] = useState({ name:'', category:'IT', gst:'', pan:'', contactPerson:'', email:'', phone:'', address:'', bankAccount:'', ifsc:'', status:'Active' });
  const [formErrors, setFormErrors] = useState({});

  useEffect(() => { setTimeout(() => setLoading(false), 600); }, []);

  const filtered = useMemo(() => vendors.filter(v => {
    const q = search.toLowerCase();
    const matchSearch = !q || v.name.toLowerCase().includes(q) || v.contactPerson?.toLowerCase().includes(q) || v.email?.toLowerCase().includes(q) || v.gst?.toLowerCase().includes(q);
    const matchCat = !filterCategory || v.category === filterCategory;
    const matchStatus = !filterStatus || v.status === filterStatus;
    return matchSearch && matchCat && matchStatus;
  }), [vendors, search, filterCategory, filterStatus]);

  const openAdd = () => {
    setEditVendor(null);
    setForm({ name:'', category:'IT', gst:'', pan:'', contactPerson:'', email:'', phone:'', address:'', bankAccount:'', ifsc:'', status:'Active' });
    setFormErrors({});
    setModalOpen(true);
  };

  const openEdit = (v) => {
    setEditVendor(v);
    setForm({ name: v.name, category: v.category, gst: v.gst, pan: v.pan||'', contactPerson: v.contactPerson||'', email: v.email||'', phone: v.phone||'', address: v.address||'', bankAccount: v.bankAccount||'', ifsc: v.ifsc||'', status: v.status });
    setFormErrors({});
    setModalOpen(true);
  };

  const validateForm = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Company name is required';
    if (!form.gst.trim()) e.gst = 'GST number is required';
    else if (!validateGST(form.gst)) e.gst = 'Invalid GST format (e.g. 27AAPCS0472N1Z2)';
    if (form.email && !validateEmail(form.email)) e.email = 'Invalid email address';
    if (form.phone && !validatePhone(form.phone)) e.phone = 'Invalid phone (10 digits, starts with 6-9)';
    setFormErrors(e);
    return Object.keys(e).length === 0;
  };

  const saveVendor = () => {
    if (!validateForm()) return;
    if (editVendor) {
      setVendors(prev => prev.map(v => v.id === editVendor.id ? { ...v, ...form } : v));
      addLog('UPDATE', 'Vendor', editVendor.id, `Updated vendor "${form.name}"`);
      showToast('Vendor updated successfully', 'success');
    } else {
      const newV = { id: generateId('v'), ...form, rating: 3.5, createdAt: new Date().toISOString().split('T')[0] };
      setVendors(prev => [...prev, newV]);
      addLog('CREATE', 'Vendor', newV.id, `Created vendor "${form.name}"`);
      showToast('Vendor added successfully', 'success');
    }
    setModalOpen(false);
  };

  const toggleStatus = (vendor) => {
    const next = vendor.status === 'Active' ? 'Inactive' : 'Active';
    setVendors(prev => prev.map(v => v.id === vendor.id ? { ...v, status: next } : v));
    addLog('UPDATE', 'Vendor', vendor.id, `Changed status to ${next}: "${vendor.name}"`);
    showToast(`Vendor ${next === 'Active' ? 'activated' : 'deactivated'}`, 'success');
    setConfirmToggle(null);
  };

  const columns = [
    { key: 'name', label: 'Vendor Name', render: v => <div><div style={{ fontWeight: 500 }}>{v.name}</div><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{v.gst}</div></div> },
    { key: 'category', label: 'Category', render: v => <span className="badge badge-primary"><span className="badge-dot"></span>{v.category}</span> },
    { key: 'contactPerson', label: 'Contact Person' },
    { key: 'email', label: 'Email', render: v => <span style={{ color: 'var(--primary)', fontSize: 13 }}>{v.email}</span> },
    { key: 'phone', label: 'Phone', render: v => <span className="mono" style={{ fontSize: 13 }}>{v.phone}</span> },
    { key: 'rating', label: 'Rating', render: v => <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}><Stars rating={v.rating} /><span style={{ fontSize: 12, color: 'var(--text-muted)' }}>({v.rating})</span></div> },
    { key: 'status', label: 'Status', render: v => <StatusBadge status={v.status} /> },
    { key: 'actions', label: 'Actions', render: v => (
      <div style={{ display: 'flex', gap: 6 }}>
        <button className="btn btn-sm btn-secondary" onClick={e => { e.stopPropagation(); setPanelVendor(v); setPanelTab('details'); }}>View</button>
        <button className="btn btn-sm btn-secondary" onClick={e => { e.stopPropagation(); openEdit(v); }}>Edit</button>
        <button className={`btn btn-sm ${v.status === 'Active' ? 'btn-warning' : 'btn-success'}`} onClick={e => { e.stopPropagation(); setConfirmToggle(v); }}>
          {v.status === 'Active' ? 'Deactivate' : 'Activate'}
        </button>
      </div>
    )},
  ];

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24 }}>
        <div><h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Vendor Management</h2><p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>Register and manage your supplier network</p></div>
        <button className="btn btn-primary" onClick={openAdd}><span>+</span> Add Vendor</button>
      </div>

      <div className="card">
        <div className="card-body" style={{ paddingBottom: 0 }}>
          <div className="filter-bar">
            <div className="search-wrap" style={{ flex: 1, maxWidth: 320 }}>
              <span className="search-icon" style={{ display:"flex", alignItems:"center", color:"var(--text-muted)" }}><Icon name="search" size={14} /></span>
              <input className="form-input" placeholder="Search vendors, GST, contact..." value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 36 }} />
            </div>
            <select className="form-select" style={{ width: 160 }} value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
              <option value="">All Categories</option>
              {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="form-select" style={{ width: 140 }} value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All Status</option>
              {VENDOR_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>{filtered.length} vendor{filtered.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
        <DataTable columns={columns} data={filtered.map(v => ({ ...v, _onClick: () => { setPanelVendor(v); setPanelTab('details'); } }))} loading={loading} emptyTitle="No vendors found" emptySub="Add your first vendor to get started." emptyAction={<button className="btn btn-primary" onClick={openAdd}>+ Add Vendor</button>} />
      </div>

      {/* Add/Edit Modal */}
      {modalOpen && (
        <div className="modal-overlay" onClick={() => setModalOpen(false)}>
          <div className="modal modal-lg" onClick={e => e.stopPropagation()} style={{ maxHeight: '90vh' }}>
            <div className="modal-header">
              <span className="modal-title">{editVendor ? 'Edit Vendor' : 'Add New Vendor'}</span>
              <button className="btn-icon btn-secondary" onClick={() => setModalOpen(false)}><Icon name="close" size={14} /></button>
            </div>
            <div className="modal-body">
              <div className="grid-2" style={{ gap: 16 }}>
                <div className="form-group">
                  <label className="form-label">Company Name <span className="req">*</span></label>
                  <input className={`form-input${formErrors.name ? ' error' : ''}`} value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Acme Corp Pvt Ltd" />
                  {formErrors.name && <span className="form-error">{formErrors.name}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">Category <span className="req">*</span></label>
                  <select className="form-select" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                    {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">GST Number <span className="req">*</span></label>
                  <input className={`form-input mono${formErrors.gst ? ' error' : ''}`} value={form.gst} onChange={e => setForm(f => ({ ...f, gst: e.target.value.toUpperCase() }))} placeholder="27AAPCS0472N1Z2" maxLength={15} />
                  {formErrors.gst && <span className="form-error">{formErrors.gst}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">PAN Number</label>
                  <input className="form-input mono" value={form.pan} onChange={e => setForm(f => ({ ...f, pan: e.target.value.toUpperCase() }))} placeholder="AAPCS0472N" maxLength={10} />
                </div>
                <div className="form-group">
                  <label className="form-label">Contact Person</label>
                  <input className="form-input" value={form.contactPerson} onChange={e => setForm(f => ({ ...f, contactPerson: e.target.value }))} placeholder="Rahul Mehta" />
                </div>
                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input className={`form-input${formErrors.email ? ' error' : ''}`} type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} placeholder="contact@vendor.com" />
                  {formErrors.email && <span className="form-error">{formErrors.email}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">Phone</label>
                  <input className={`form-input mono${formErrors.phone ? ' error' : ''}`} value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} placeholder="9876543210" maxLength={10} />
                  {formErrors.phone && <span className="form-error">{formErrors.phone}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">Status</label>
                  <select className="form-select" value={form.status} onChange={e => setForm(f => ({ ...f, status: e.target.value }))}>
                    <option>Active</option><option>Inactive</option><option>Blacklisted</option>
                  </select>
                </div>
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Address</label>
                  <textarea className="form-textarea" value={form.address} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} placeholder="Full address with pin code" rows={2} />
                </div>
                <div className="form-group">
                  <label className="form-label">Bank Account Number</label>
                  <input className="form-input mono" value={form.bankAccount} onChange={e => setForm(f => ({ ...f, bankAccount: e.target.value }))} placeholder="50200012345678" />
                </div>
                <div className="form-group">
                  <label className="form-label">IFSC Code</label>
                  <input className="form-input mono" value={form.ifsc} onChange={e => setForm(f => ({ ...f, ifsc: e.target.value.toUpperCase() }))} placeholder="HDFC0001234" maxLength={11} />
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setModalOpen(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={saveVendor}>{editVendor ? 'Save Changes' : 'Add Vendor'}</button>
            </div>
          </div>
        </div>
      )}

      {/* Vendor Profile Slide Panel */}
      {panelVendor && (
        <>
          <div className="slide-panel-overlay" onClick={() => setPanelVendor(null)} />
          <div className="slide-panel">
            <div className="slide-panel-header">
              <div>
                <div style={{ fontWeight: 600, fontSize: 16 }}>{panelVendor.name}</div>
                <StatusBadge status={panelVendor.status} />
              </div>
              <button className="btn-icon btn-secondary" onClick={() => setPanelVendor(null)}><Icon name="close" size={14} /></button>
            </div>
            <div className="tabs" style={{ padding: '0 24px', borderBottom: '1px solid var(--border)' }}>
              {['details','history','documents'].map(t => (
                <div key={t} className={`tab${panelTab === t ? ' active' : ''}`} onClick={() => setPanelTab(t)} style={{ textTransform: 'capitalize' }}>{t}</div>
              ))}
            </div>
            <div className="slide-panel-body">
              {panelTab === 'details' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                    <Avatar name={panelVendor.name} size={56} />
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 18 }}>{panelVendor.name}</div>
                      <div style={{ color: 'var(--text-secondary)', fontSize: 14 }}>{panelVendor.category}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}><Stars rating={panelVendor.rating} /><span style={{ fontSize: 13, color: 'var(--text-muted)' }}>{panelVendor.rating}/5</span></div>
                    </div>
                  </div>
                  {[['GST Number', panelVendor.gst, true], ['PAN Number', panelVendor.pan, true], ['Contact Person', panelVendor.contactPerson, false], ['Email', panelVendor.email, false], ['Phone', panelVendor.phone, true], ['Address', panelVendor.address, false], ['Bank Account', panelVendor.bankAccount, true], ['IFSC Code', panelVendor.ifsc, true], ['Member Since', formatDate(panelVendor.createdAt), false]].map(([label, val, mono]) => (
                    val && <div key={label} style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                      <span style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 500 }}>{label}</span>
                      <span style={{ fontSize: 14, fontFamily: mono ? 'DM Mono, monospace' : undefined }}>{val}</span>
                    </div>
                  ))}
                </div>
              )}
              {panelTab === 'history' && (
                <div>
                  <div style={{ fontWeight: 500, marginBottom: 12, fontSize: 14 }}>Procurement History</div>
                  {INITIAL_RFQS.filter(r => r.vendors?.includes(panelVendor.id)).map(rfq => (
                    <div key={rfq.id} style={{ padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                        <span className="mono" style={{ color: 'var(--primary)', fontSize: 13 }}>{rfq.rfqNumber}</span>
                        <StatusBadge status={rfq.status} />
                      </div>
                      <div style={{ fontWeight: 500, fontSize: 14 }}>{rfq.title}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{formatDate(rfq.createdAt)}</div>
                    </div>
                  ))}
                  {INITIAL_RFQS.filter(r => r.vendors?.includes(panelVendor.id)).length === 0 && <div style={{ color: 'var(--text-muted)', fontSize: 14, textAlign: 'center', padding: 32 }}>No procurement history</div>}
                </div>
              )}
              {panelTab === 'documents' && (
                <div>
                  <div style={{ fontWeight: 500, marginBottom: 16, fontSize: 14 }}>Vendor Documents</div>
                  {['GST Certificate', 'PAN Card', 'Company Registration', 'Bank Statement'].map(doc => (
                    <div key={doc} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <span style={{ fontSize: 20 }}>📄</span>
                        <div>
                          <div style={{ fontWeight: 500, fontSize: 14 }}>{doc}</div>
                          <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Not uploaded</div>
                        </div>
                      </div>
                      <button className="btn btn-sm btn-secondary">Upload</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{ padding: '16px 24px', borderTop: '1px solid var(--border)', display: 'flex', gap: 10 }}>
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => openEdit(panelVendor)}>Edit Vendor</button>
              <button className="btn btn-secondary" onClick={() => setPanelVendor(null)}>Close</button>
            </div>
          </div>
        </>
      )}

      <ConfirmDialog open={!!confirmToggle} title={confirmToggle?.status === 'Active' ? 'Deactivate Vendor?' : 'Activate Vendor?'} message={`Are you sure you want to ${confirmToggle?.status === 'Active' ? 'deactivate' : 'activate'} "${confirmToggle?.name}"?`} confirmLabel={confirmToggle?.status === 'Active' ? 'Deactivate' : 'Activate'} confirmClass={confirmToggle?.status === 'Active' ? 'btn-warning' : 'btn-success'} icon={confirmToggle?.status === 'Active' ? 'warning_tri' : 'activate'} onConfirm={() => toggleStatus(confirmToggle)} onCancel={() => setConfirmToggle(null)} />
    </div>
  );
};

// ═══════════════════════════════════════════════════
// RFQ MANAGEMENT
// ═══════════════════════════════════════════════════

const RFQManagement = () => {
  const { rfqs, setRfqs, vendors, quotations, currentUser, showToast, addLog, addNotification, setCurrentPage } = useApp();
  const [view, setView] = useState('list'); // list | create | detail
  const [selectedRfq, setSelectedRfq] = useState(null);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [loading, setLoading] = useState(true);
  const [step, setStep] = useState(1);
  const [rfqTab, setRfqTab] = useState('quotations');
  const [confirmSend, setConfirmSend] = useState(false);
  const [editRfqId, setEditRfqId] = useState(null);

  const [form, setForm] = useState({
    title: '', description: '', category: 'IT', deadline: '', priority: 'Medium',
    lineItems: [{ id: generateId('li'), name: '', description: '', qty: 1, unit: 'Nos', estimatedPrice: 0 }],
    vendors: [],
  });
  const [formErrors, setFormErrors] = useState({});

  useEffect(() => { setTimeout(() => setLoading(false), 500); }, []);

  const canCreate = [ROLES.ADMIN, ROLES.OFFICER].includes(currentUser?.role);
  const vendorSearch = useState('')[0];

  const filtered = useMemo(() => rfqs.filter(r => {
    const q = search.toLowerCase();
    const matchSearch = !q || r.title.toLowerCase().includes(q) || r.rfqNumber.toLowerCase().includes(q);
    const matchStatus = !filterStatus || r.status === filterStatus;
    return matchSearch && matchStatus;
  }), [rfqs, search, filterStatus]);

  const totalEstimate = form.lineItems.reduce((s, i) => s + (Number(i.qty) * Number(i.estimatedPrice)), 0);

  const addLineItem = () => setForm(f => ({ ...f, lineItems: [...f.lineItems, { id: generateId('li'), name: '', description: '', qty: 1, unit: 'Nos', estimatedPrice: 0 }] }));
  const removeLineItem = (id) => setForm(f => ({ ...f, lineItems: f.lineItems.filter(li => li.id !== id) }));
  const updateLineItem = (id, field, value) => setForm(f => ({ ...f, lineItems: f.lineItems.map(li => li.id === id ? { ...li, [field]: value } : li) }));

  const validateStep = (s) => {
    const e = {};
    if (s === 1) {
      if (!form.title.trim()) e.title = 'RFQ title is required';
      if (!form.deadline) e.deadline = 'Deadline is required';
      else if (new Date(form.deadline) <= new Date('2026-06-06')) e.deadline = 'Deadline must be a future date';
    }
    if (s === 2) {
      if (form.lineItems.some(li => !li.name.trim())) e.lineItems = 'All items must have a name';
    }
    if (s === 3) {
      if (form.vendors.length === 0) e.vendors = 'Select at least one vendor';
    }
    setFormErrors(e);
    return Object.keys(e).length === 0;
  };

  const saveRfq = (status) => {
    if (editRfqId) {
      // UPDATE existing RFQ
      const updated = { ...rfqs.find(r => r.id === editRfqId), ...form, status };
      setRfqs(prev => prev.map(r => r.id === editRfqId ? updated : r));
      addLog('UPDATE', 'RFQ', editRfqId, `Updated RFQ "${form.title}" — status: ${status}`);
      if (status === 'Sent') {
        addLog('SEND', 'RFQ', editRfqId, `Sent RFQ to ${form.vendors.length} vendors`);
        form.vendors.forEach(vId => {
          addNotification('rfq', `RFQ updated & sent: ${form.title} — submit your quotation`, vId);
        });
        showToast(`RFQ updated and sent to ${form.vendors.length} vendor(s)`, 'success');
      } else {
        showToast('RFQ updated and saved as draft', 'success');
      }
      // Go back to detail view
      setSelectedRfq({ ...updated });
      setView('detail');
      setRfqTab('quotations');
    } else {
      // CREATE new RFQ
      const count = rfqs.length + 1;
      const newRfq = {
        id: generateId('rfq'),
        rfqNumber: generateRFQNumber(count),
        ...form, status,
        createdBy: currentUser.id,
        createdAt: new Date().toISOString().split('T')[0],
      };
      setRfqs(prev => [newRfq, ...prev]);
      addLog('CREATE', 'RFQ', newRfq.id, `Created RFQ "${newRfq.title}" with status: ${status}`);
      if (status === 'Sent') {
        addLog('SEND', 'RFQ', newRfq.id, `Sent RFQ to ${form.vendors.length} vendors`);
        form.vendors.forEach(vId => {
          const v = vendors.find(vn => vn.id === vId);
          addNotification('rfq', `You have been invited to submit quotation for ${newRfq.rfqNumber}: ${newRfq.title}`, vId);
        });
        showToast(`RFQ ${newRfq.rfqNumber} sent to ${form.vendors.length} vendor(s)`, 'success');
      } else {
        showToast('RFQ saved as draft', 'success');
      }
      setView('list');
    }
    setStep(1);
    setEditRfqId(null);
    setForm({ title: '', description: '', category: 'IT', deadline: '', priority: 'Medium', lineItems: [{ id: generateId('li'), name: '', description: '', qty: 1, unit: 'Nos', estimatedPrice: 0 }], vendors: [] });
  };


  const priorityColors = { High: '#DC2626', Medium: '#D97706', Low: '#16A34A' };

  const columns = [
    { key: 'rfqNumber', label: 'RFQ Number', render: r => <span className="mono" style={{ color: 'var(--primary)', fontWeight: 500 }}>{r.rfqNumber}</span> },
    { key: 'title', label: 'Title', render: r => <div><div style={{ fontWeight: 500 }}>{r.title}</div><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{r.category}</div></div> },
    { key: 'priority', label: 'Priority', render: r => <span style={{ color: priorityColors[r.priority], fontWeight: 600, fontSize: 13 }}>● {r.priority}</span> },
    { key: 'deadline', label: 'Deadline', render: r => { const d = daysUntil(r.deadline); return <div><div>{formatDate(r.deadline)}</div>{d !== null && r.status !== 'Closed' && <div className={d < 0 ? 'deadline-urgent' : d < 3 ? 'deadline-urgent' : d < 7 ? 'deadline-warning' : ''} style={{ fontSize: 12 }}>{d < 0 ? 'Overdue' : `${d}d left`}</div>}</div>; } },
    { key: 'vendors', label: 'Vendors', render: r => <span>{r.vendors?.length || 0}</span> },
    { key: 'quotations', label: 'Quotations', render: r => { const qCount = quotations.filter(q => q.rfqId === r.id).length; return <span>{qCount}/{r.vendors?.length || 0}</span>; } },
    { key: 'status', label: 'Status', render: r => <StatusBadge status={r.status} /> },
    { key: 'actions', label: '', render: r => (
      <div style={{ display: 'flex', gap: 6 }}>
        <button className="btn btn-sm btn-secondary" onClick={e => { e.stopPropagation(); setSelectedRfq(r); setView('detail'); setRfqTab('quotations'); }}>View</button>
        {canCreate && r.status === 'Draft' && (
          <button className="btn btn-sm btn-primary" onClick={e => { e.stopPropagation(); openEditRfq(r); }}>Edit</button>
        )}
      </div>
    )},
  ];

  const [confirmSendExisting, setConfirmSendExisting] = useState(false);


  const sendExistingRfq = (rfq) => {
    if (!rfq.vendors || rfq.vendors.length === 0) {
      showToast('Add at least one vendor before sending', 'error'); return;
    }
    setRfqs(prev => prev.map(r => r.id === rfq.id ? { ...r, status: 'Sent' } : r));
    setSelectedRfq(prev => ({ ...prev, status: 'Sent' }));
    addLog('SEND', 'RFQ', rfq.id, `Sent RFQ ${rfq.rfqNumber} to ${rfq.vendors.length} vendors`);
    rfq.vendors.forEach(vId => {
      addNotification('rfq', `New RFQ ${rfq.rfqNumber}: ${rfq.title} — submit your quotation`, vId);
    });
    showToast(`RFQ ${rfq.rfqNumber} sent to ${rfq.vendors.length} vendor(s)`, 'success');
    setConfirmSendExisting(false);
  };

  const closeRfq = (rfq) => {
    setRfqs(prev => prev.map(r => r.id === rfq.id ? { ...r, status: 'Closed' } : r));
    setSelectedRfq(prev => ({ ...prev, status: 'Closed' }));
    addLog('UPDATE', 'RFQ', rfq.id, `Closed RFQ ${rfq.rfqNumber}`);
    showToast(`RFQ ${rfq.rfqNumber} closed`, 'info');
  };

  const openEditRfq = (rfq) => {
    setForm({
      title: rfq.title, description: rfq.description || '', category: rfq.category,
      deadline: rfq.deadline, priority: rfq.priority,
      lineItems: rfq.lineItems || [{ id: generateId('li'), name: '', description: '', qty: 1, unit: 'Nos', estimatedPrice: 0 }],
      vendors: rfq.vendors || [],
    });
    setEditRfqId(rfq.id);
    setStep(1);
    setView('create');
  };


  if (view === 'create') {
    const activeVendors = vendors.filter(v => v.status === 'Active');
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 28 }}>
          <button className="btn btn-secondary" onClick={() => { setView(editRfqId ? 'detail' : 'list'); setStep(1); setEditRfqId(null); }}>← {editRfqId ? 'Back to RFQ' : 'Back'}</button>
          <div><h2 style={{ fontSize: 20, fontWeight: 600 }}>{editRfqId ? 'Edit RFQ' : 'Create New RFQ'}</h2><p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>{editRfqId ? 'Update the RFQ details below' : 'Fill in the details to initiate a procurement request'}</p></div>
        </div>

        {/* Step indicator */}
        <div className="steps" style={{ marginBottom: 32 }}>
          {[['RFQ Details', 1], ['Line Items', 2], ['Select Vendors', 3], ['Review & Send', 4]].map(([label, s], i, arr) => (
            <React.Fragment key={s}>
              <div className="step" style={{ flexDirection: 'column', alignItems: 'center', flex: 'none' }}>
                <div className={`step-circle ${step > s ? 'done' : step === s ? 'active' : 'pending'}`}>{step > s ? '✓' : s}</div>
                <div className="step-label" style={{ color: step === s ? 'var(--primary)' : 'var(--text-muted)', textAlign: 'center', marginTop: 6 }}>{label}</div>
              </div>
              {i < arr.length - 1 && <div className={`step-connector${step > s ? ' done' : ''}`} style={{ marginTop: -16 }}></div>}
            </React.Fragment>
          ))}
        </div>

        <div className="card card-body">
          {step === 1 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">RFQ Title <span className="req">*</span></label>
                  <input className={`form-input${formErrors.title ? ' error' : ''}`} value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="e.g. Office Furniture Procurement Q3 2026" />
                  {formErrors.title && <span className="form-error">{formErrors.title}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">Category <span className="req">*</span></label>
                  <select className="form-select" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                    {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Deadline <span className="req">*</span></label>
                  <input className={`form-input${formErrors.deadline ? ' error' : ''}`} type="date" value={form.deadline} onChange={e => setForm(f => ({ ...f, deadline: e.target.value }))} min="2026-06-07" />
                  {formErrors.deadline && <span className="form-error">{formErrors.deadline}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">Priority</label>
                  <select className="form-select" value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))}>
                    <option>High</option><option>Medium</option><option>Low</option>
                  </select>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Description / Scope of Work</label>
                <textarea className="form-textarea" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="Describe the procurement requirement in detail — specifications, standards, delivery requirements, etc." rows={4} />
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                <div><div style={{ fontWeight: 600, fontSize: 15 }}>Line Items</div><div style={{ fontSize: 13, color: 'var(--text-muted)' }}>Add all products or services required</div></div>
                <button className="btn btn-secondary" onClick={addLineItem}><span>+</span> Add Item</button>
              </div>
              {formErrors.lineItems && <div style={{ marginBottom: 12, padding: '8px 12px', background: '#FEE2E2', border: '1px solid #FECACA', borderRadius: 6, color: '#991B1B', fontSize: 13 }}>{formErrors.lineItems}</div>}
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ background: 'var(--surface)' }}>
                      {['Item Name *', 'Description', 'Qty *', 'Unit', 'Est. Price (₹)', ''].map(h => <th key={h} style={{ padding: '8px 12px', textAlign: 'left', fontSize: 12, fontWeight: 600, color: 'var(--text-secondary)', borderBottom: '1px solid var(--border)' }}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {form.lineItems.map((li, i) => (
                      <tr key={li.id}>
                        <td style={{ padding: '8px 6px' }}><input className="form-input" value={li.name} onChange={e => updateLineItem(li.id, 'name', e.target.value)} placeholder="Item name" style={{ minWidth: 160 }} /></td>
                        <td style={{ padding: '8px 6px' }}><input className="form-input" value={li.description} onChange={e => updateLineItem(li.id, 'description', e.target.value)} placeholder="Optional" style={{ minWidth: 160 }} /></td>
                        <td style={{ padding: '8px 6px' }}><input className="form-input mono" type="number" min="1" value={li.qty} onChange={e => updateLineItem(li.id, 'qty', e.target.value)} style={{ width: 80 }} /></td>
                        <td style={{ padding: '8px 6px' }}>
                          <select className="form-select" value={li.unit} onChange={e => updateLineItem(li.id, 'unit', e.target.value)} style={{ width: 90 }}>
                            {['Nos','Pcs','Kg','Litre','Meter','Pack','Set','Year','Month'].map(u => <option key={u}>{u}</option>)}
                          </select>
                        </td>
                        <td style={{ padding: '8px 6px' }}><input className="form-input mono" type="number" min="0" value={li.estimatedPrice} onChange={e => updateLineItem(li.id, 'estimatedPrice', e.target.value)} style={{ width: 120 }} /></td>
                        <td style={{ padding: '8px 6px' }}>{form.lineItems.length > 1 && <button className="btn btn-sm btn-danger" onClick={() => removeLineItem(li.id)}><Icon name="close" size={14} /></button>}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colSpan={4} style={{ padding: '10px 6px', textAlign: 'right', fontWeight: 600, fontSize: 14 }}>Total Estimated Value:</td>
                      <td style={{ padding: '10px 6px', fontFamily: 'DM Mono, monospace', fontWeight: 600, color: 'var(--primary)', fontSize: 15 }}>{formatCurrency(totalEstimate)}</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Select Vendors</div>
                <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>Choose vendors to invite for this RFQ. Only active vendors are shown.</div>
              </div>
              {formErrors.vendors && <div style={{ marginBottom: 12, padding: '8px 12px', background: '#FEE2E2', border: '1px solid #FECACA', borderRadius: 6, color: '#991B1B', fontSize: 13 }}>{formErrors.vendors}</div>}
              <div style={{ marginBottom: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: 13, color: 'var(--text-secondary)' }}><strong>{form.vendors.length}</strong> vendor{form.vendors.length !== 1 ? 's' : ''} selected</span>
                <select className="form-select" style={{ width: 160 }} onChange={e => {
                  const cat = e.target.value;
                  if (!cat) return;
                  const relevant = activeVendors.filter(v => v.category === cat).map(v => v.id);
                  setForm(f => ({ ...f, vendors: [...new Set([...f.vendors, ...relevant])] }));
                }}>
                  <option value="">Filter by category</option>
                  {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>Auto-select {c}</option>)}
                </select>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {activeVendors.map(v => (
                  <div key={v.id} className={`checkbox-item${form.vendors.includes(v.id) ? ' checked' : ''}`} onClick={() => setForm(f => ({ ...f, vendors: f.vendors.includes(v.id) ? f.vendors.filter(id => id !== v.id) : [...f.vendors, v.id] }))}>
                    <input type="checkbox" checked={form.vendors.includes(v.id)} onChange={() => {}} style={{ accentColor: 'var(--primary)' }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 500, fontSize: 14 }}>{v.name}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{v.category} · <Stars rating={v.rating} /></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 12 }}>Review RFQ Details</div>
                <div className="card" style={{ padding: 16, marginBottom: 16 }}>
                  <div className="grid-2" style={{ gap: 12 }}>
                    {[['Title', form.title], ['Category', form.category], ['Deadline', formatDate(form.deadline)], ['Priority', form.priority]].map(([l, v]) => (
                      <div key={l}><div style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 500 }}>{l}</div><div style={{ fontSize: 14, fontWeight: 500, marginTop: 2 }}>{v}</div></div>
                    ))}
                  </div>
                  {form.description && <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)' }}><div style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 500, marginBottom: 4 }}>Description</div><div style={{ fontSize: 14, color: 'var(--text-secondary)', lineHeight: 1.6 }}>{form.description}</div></div>}
                </div>
                <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>Line Items ({form.lineItems.length})</div>
                <table className="data-table" style={{ marginBottom: 16 }}>
                  <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th style={{ textAlign: 'right' }}>Est. Price</th><th style={{ textAlign: 'right' }}>Total</th></tr></thead>
                  <tbody>
                    {form.lineItems.map(li => (
                      <tr key={li.id}>
                        <td>{li.name}<div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{li.description}</div></td>
                        <td>{li.qty}</td><td>{li.unit}</td>
                        <td style={{ textAlign: 'right', fontFamily: 'DM Mono, monospace' }}>{formatCurrency(li.estimatedPrice)}</td>
                        <td style={{ textAlign: 'right', fontFamily: 'DM Mono, monospace', fontWeight: 500 }}>{formatCurrency(li.qty * li.estimatedPrice)}</td>
                      </tr>
                    ))}
                    <tr><td colSpan={3}></td><td style={{ textAlign: 'right', fontWeight: 600 }}>Total</td><td style={{ textAlign: 'right', fontFamily: 'DM Mono, monospace', fontWeight: 600, color: 'var(--primary)' }}>{formatCurrency(totalEstimate)}</td></tr>
                  </tbody>
                </table>
                <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>Selected Vendors ({form.vendors.length})</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {form.vendors.map(vId => { const v = vendors.find(vn => vn.id === vId); return v ? <span key={vId} style={{ padding: '4px 12px', background: 'var(--primary-light)', color: 'var(--primary)', borderRadius: 20, fontSize: 13, fontWeight: 500 }}>{v.name}</span> : null; })}
                </div>
              </div>
            </div>
          )}

          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 24, paddingTop: 20, borderTop: '1px solid var(--border)' }}>
            <button className="btn btn-secondary" onClick={() => step > 1 ? setStep(s => s - 1) : (editRfqId ? (setView('detail'), setStep(1), setEditRfqId(null)) : setView('list'))}>
              {step > 1 ? '← Previous' : (editRfqId ? '✕ Cancel Edit' : '✕ Cancel')}
            </button>
            <div style={{ display: 'flex', gap: 10 }}>
              {step === 4 && <button className="btn btn-secondary" onClick={() => saveRfq('Draft')}>Save as Draft</button>}
              {step < 4
                ? <button className="btn btn-primary" onClick={() => { if (validateStep(step)) setStep(s => s + 1); }}>Next Step →</button>
                : <button className="btn btn-primary" onClick={() => setConfirmSend(true)}><Icon name="send" size={13} /> Send to Vendors</button>
              }
            </div>
          </div>
        </div>

        <ConfirmDialog open={confirmSend} title="Send RFQ to Vendors?" message={`This will send the RFQ to ${form.vendors.length} vendor(s). They will receive a notification to submit quotations.`} icon="send" confirmLabel="Send RFQ" confirmClass="btn-primary" onConfirm={() => { saveRfq('Sent'); setConfirmSend(false); }} onCancel={() => setConfirmSend(false)} />
      </div>
    );
  }

  if (view === 'detail' && selectedRfq) {
    const rfqQuotes = quotations.filter(q => q.rfqId === selectedRfq.id);
    const statusSteps = ['Draft', 'Sent', 'Quotations Received', 'Under Review', 'Closed'];
    const currentStepIdx = statusSteps.indexOf(selectedRfq.status);
    const isDraft  = selectedRfq.status === 'Draft';
    const isSent   = selectedRfq.status === 'Sent' || selectedRfq.status === 'Quotations Received' || selectedRfq.status === 'Under Review';
    const isClosed = selectedRfq.status === 'Closed';

    return (
      <div>
        {/* ── Header with action buttons ── */}
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 24 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <button className="btn btn-secondary" onClick={() => setView('list')}><Icon name="arrow_right" size={14} style={{ transform:'rotate(180deg)' }} /> Back</button>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
                <span className="mono" style={{ color: 'var(--primary)', fontWeight: 700, fontSize: 15 }}>{selectedRfq.rfqNumber}</span>
                <StatusBadge status={selectedRfq.status} />
                <span style={{ color: priorityColors[selectedRfq.priority], fontSize: 12, fontWeight: 600 }}>● {selectedRfq.priority}</span>
              </div>
              <h2 style={{ fontSize: 19, fontWeight: 600, color: 'var(--text-primary)' }}>{selectedRfq.title}</h2>
            </div>
          </div>

          {/* Action buttons based on status */}
          {canCreate && (
            <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
              {isDraft && (
                <>
                  <button className="btn btn-secondary" onClick={() => openEditRfq(selectedRfq)}>
                    <Icon name="edit" size={13} /> Edit RFQ
                  </button>
                  <button className="btn btn-primary" onClick={() => setConfirmSendExisting(true)}>
                    <Icon name="send" size={13} /> Send to Vendors
                  </button>
                </>
              )}
              {isSent && (
                <>
                  <button className="btn btn-secondary" onClick={() => { setCurrentPage('comparison'); }}>
                    <Icon name="qa_compare" size={13} /> Compare Quotes
                  </button>
                  <button className="btn btn-warning" onClick={() => closeRfq(selectedRfq)} style={{ color: 'white' }}>
                    <Icon name="ic_x" size={13} /> Close RFQ
                  </button>
                </>
              )}
              {isClosed && (
                <span style={{ fontSize: 13, color: 'var(--text-muted)', padding: '6px 12px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4 }}>
                  RFQ Closed
                </span>
              )}
            </div>
          )}
        </div>

        {/* Status progress bar */}
        <div className="card card-body" style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
            {statusSteps.map((s, i) => (
              <React.Fragment key={s}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1 }}>
                  <div style={{ width: 28, height: 28, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 600, background: i <= currentStepIdx ? 'var(--primary)' : 'var(--surface)', color: i <= currentStepIdx ? 'white' : 'var(--text-muted)', border: i > currentStepIdx ? '2px solid var(--border)' : 'none' }}>
                    {i < currentStepIdx ? <Icon name="check_sm" size={13} /> : i + 1}
                  </div>
                  <div style={{ fontSize: 11, marginTop: 4, fontWeight: i === currentStepIdx ? 600 : 400, color: i === currentStepIdx ? 'var(--primary)' : 'var(--text-muted)', textAlign: 'center', whiteSpace: 'nowrap' }}>{s}</div>
                </div>
                {i < statusSteps.length - 1 && <div style={{ flex: 1, height: 2, background: i < currentStepIdx ? 'var(--primary)' : 'var(--border)', margin: '0 4px', marginBottom: 16 }}></div>}
              </React.Fragment>
            ))}
          </div>
        </div>

        {/* Confirm send existing RFQ */}
        <ConfirmDialog
          open={confirmSendExisting}
          title="Send RFQ to Vendors?"
          message={`This will send RFQ ${selectedRfq.rfqNumber} to ${selectedRfq.vendors?.length || 0} vendor(s). They will be notified to submit quotations.`}
          confirmLabel="Send RFQ"
          confirmClass="btn-primary"
          onConfirm={() => sendExistingRfq(selectedRfq)}
          onCancel={() => setConfirmSendExisting(false)}
        />


        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 20, marginBottom: 20 }}>
          <div className="card">
            <div className="card-header"><span className="card-title">RFQ Details</span></div>
            <div className="card-body">
              <div className="grid-2" style={{ gap: 14, marginBottom: 16 }}>
                {[['Category', selectedRfq.category], ['Deadline', formatDate(selectedRfq.deadline)], ['Created', formatDate(selectedRfq.createdAt)]].map(([l, v]) => (
                  <div key={l}><div style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 500 }}>{l}</div><div style={{ fontSize: 14, fontWeight: 500, marginTop: 2 }}>{v}</div></div>
                ))}
              </div>
              {selectedRfq.description && <div style={{ fontSize: 14, color: 'var(--text-secondary)', lineHeight: 1.7 }}>{selectedRfq.description}</div>}
            </div>
          </div>
          <div className="card">
            <div className="card-header"><span className="card-title">Invited Vendors</span></div>
            <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {selectedRfq.vendors?.map(vId => {
                const v = vendors.find(vn => vn.id === vId);
                const q = quotations.find(q => q.rfqId === selectedRfq.id && q.vendorId === vId);
                return v ? (
                  <div key={vId} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Avatar name={v.name} size={28} />
                      <div><div style={{ fontSize: 13, fontWeight: 500 }}>{v.name}</div><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{v.category}</div></div>
                    </div>
                    <StatusBadge status={q ? q.status : 'Not Submitted'} />
                  </div>
                ) : null;
              })}
            </div>
          </div>
        </div>

        <div className="card" style={{ marginBottom: 20 }}>
          <div className="card-header"><span className="card-title">Line Items</span><span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Est. Total: <span className="mono" style={{ fontWeight: 600, color: 'var(--primary)' }}>{formatCurrency(selectedRfq.lineItems?.reduce((s, li) => s + li.qty * li.estimatedPrice, 0))}</span></span></div>
          <div style={{ overflowX: 'auto' }}>
            <table className="data-table">
              <thead><tr><th>#</th><th>Item Name</th><th>Description</th><th>Qty</th><th>Unit</th><th style={{ textAlign: 'right' }}>Est. Price</th><th style={{ textAlign: 'right' }}>Total</th></tr></thead>
              <tbody>
                {selectedRfq.lineItems?.map((li, i) => (
                  <tr key={li.id}>
                    <td style={{ color: 'var(--text-muted)', fontSize: 13 }}>{i + 1}</td>
                    <td style={{ fontWeight: 500 }}>{li.name}</td>
                    <td style={{ color: 'var(--text-secondary)', fontSize: 13 }}>{li.description}</td>
                    <td><span className="mono">{li.qty}</span></td>
                    <td>{li.unit}</td>
                    <td style={{ textAlign: 'right', fontFamily: 'DM Mono, monospace' }}>{formatCurrency(li.estimatedPrice)}</td>
                    <td style={{ textAlign: 'right', fontFamily: 'DM Mono, monospace', fontWeight: 500 }}>{formatCurrency(li.qty * li.estimatedPrice)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card">
          <div className="tabs" style={{ padding: '0 20px' }}>
            <div className={`tab${rfqTab === 'quotations' ? ' active' : ''}`} onClick={() => setRfqTab('quotations')}>Quotations ({rfqQuotes.length})</div>
            <div className={`tab${rfqTab === 'activity' ? ' active' : ''}`} onClick={() => setRfqTab('activity')}>Activity Log</div>
          </div>
          {rfqTab === 'quotations' && (
            rfqQuotes.length === 0 ? (
              <div className="empty-state"><div className="empty-state-icon"><Icon name="quotations" size={40} /></div><div className="empty-state-title">No quotations yet</div><div className="empty-state-sub">Waiting for vendors to submit their quotations.</div></div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table className="data-table">
                  <thead><tr><th>Vendor</th><th>Grand Total</th><th>GST Rate</th><th>Delivery Date</th><th>Payment Terms</th><th>Status</th><th>Submitted</th></tr></thead>
                  <tbody>
                    {rfqQuotes.map(q => (
                      <tr key={q.id}>
                        <td style={{ fontWeight: 500 }}>{q.vendorName}</td>
                        <td><span className="mono" style={{ fontWeight: 600, color: 'var(--primary)' }}>{formatCurrency(q.grandTotal)}</span></td>
                        <td>{q.gstRate}%</td>
                        <td>{formatDate(q.deliveryDate)}</td>
                        <td>{q.paymentTerms}</td>
                        <td><StatusBadge status={q.status} /></td>
                        <td style={{ fontSize: 12, color: 'var(--text-muted)' }}>{q.submittedAt}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )
          )}
          {rfqTab === 'activity' && (
            <div className="card-body">
              <div className="timeline">
                {INITIAL_LOGS.filter(l => l.entityId === selectedRfq.id || l.details?.includes(selectedRfq.rfqNumber)).slice(0, 8).map((l, i) => (
                  <div key={l.id} className="timeline-item">
                    <div className={`timeline-dot ${l.action === 'APPROVE' ? 'success' : l.action === 'REJECT' ? 'danger' : 'primary'}`}></div>
                    <div><div style={{ fontWeight: 500, fontSize: 13 }}>{l.details}</div><div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{l.userName} · {l.timestamp}</div></div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24 }}>
        <div><h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>RFQ Management</h2><p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>Manage procurement requests and vendor invitations</p></div>
        {canCreate && <button className="btn btn-primary" onClick={() => { setView('create'); setStep(1); }}>+ Create RFQ</button>}
      </div>
      <div className="card">
        <div className="card-body" style={{ paddingBottom: 0 }}>
          <div className="filter-bar">
            <div className="search-wrap" style={{ flex: 1, maxWidth: 320 }}>
              <span className="search-icon" style={{ display:"flex", alignItems:"center", color:"var(--text-muted)" }}><Icon name="search" size={14} /></span>
              <input className="form-input" placeholder="Search RFQs..." value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 36 }} />
            </div>
            <select className="form-select" style={{ width: 180 }} value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All Status</option>
              {RFQ_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>{filtered.length} RFQ{filtered.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
        <DataTable columns={columns} data={filtered.map(r => ({ ...r, _onClick: () => { setSelectedRfq(r); setView('detail'); setRfqTab('quotations'); } }))} loading={loading} emptyTitle="No RFQs found" emptySub={canCreate ? 'Create your first RFQ to start the procurement process.' : 'No RFQs match your criteria.'} emptyAction={canCreate ? <button className="btn btn-primary" onClick={() => { setView('create'); setStep(1); }}>+ Create RFQ</button> : null} />
      </div>
    </div>
  );
};


// ═══════════════════════════════════════════════════
// QUOTATION SCREENS (Vendor + Officer)
// ═══════════════════════════════════════════════════

const VendorRFQList = () => {
  const { rfqs, quotations, currentUser, setCurrentPage, vendors } = useApp();
  const myVendorId = currentUser?.vendorId;
  const myRfqs = myVendorId ? rfqs.filter(r => r.vendors?.includes(myVendorId) && r.status !== 'Draft') : [];
  const [selectedRfq, setSelectedRfq] = useState(null);

  if (selectedRfq) return <SubmitQuotation rfq={selectedRfq} onBack={() => setSelectedRfq(null)} />;

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>My RFQs</h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>RFQs you have been invited to respond to</p>
      </div>
      {myRfqs.length === 0 ? (
        <div className="card"><div className="empty-state"><div className="empty-state-icon" style={{ fontSize: 48 }}>📋</div><div className="empty-state-title">No RFQs assigned</div><div className="empty-state-sub">You have not been invited to any active RFQs yet.</div></div></div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {myRfqs.map(rfq => {
            const myQuote = quotations.find(q => q.rfqId === rfq.id && q.vendorId === myVendorId);
            const days = daysUntil(rfq.deadline);
            return (
              <div key={rfq.id} className="card card-body" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
                    <span className="mono" style={{ color: 'var(--primary)', fontWeight: 600 }}>{rfq.rfqNumber}</span>
                    <StatusBadge status={myQuote ? myQuote.status : 'Not Submitted'} />
                    <span style={{ fontSize: 12, color: rfq.priority === 'High' ? '#DC2626' : rfq.priority === 'Medium' ? '#D97706' : '#16A34A', fontWeight: 600 }}>● {rfq.priority}</span>
                  </div>
                  <div style={{ fontWeight: 600, fontSize: 16, marginBottom: 4 }}>{rfq.title}</div>
                  <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 8 }}>{rfq.category} · {rfq.lineItems?.length || 0} items</div>
                  <div style={{ display: 'flex', gap: 20, fontSize: 13 }}>
                    <span style={{ color: 'var(--text-muted)' }}>Deadline: <span className={days !== null && days < 3 ? 'deadline-urgent' : days !== null && days < 7 ? 'deadline-warning' : ''} style={{ color: days !== null && days < 3 ? '#DC2626' : days !== null && days < 7 ? '#D97706' : 'var(--text-primary)', fontWeight: days !== null && days < 7 ? 500 : 400 }}>{formatDate(rfq.deadline)}</span></span>
                    {days !== null && <span className={days < 0 ? 'deadline-urgent' : days < 3 ? 'deadline-urgent' : 'deadline-warning'} style={{ fontSize: 12 }}>{days < 0 ? '⚠ Overdue' : days < 3 ? `⚠ ${days}d left` : `${days} days remaining`}</span>}
                    {myQuote && <span style={{ color: 'var(--text-muted)' }}>Quoted: <span className="mono" style={{ color: 'var(--primary)', fontWeight: 600 }}>{formatCurrency(myQuote.grandTotal)}</span></span>}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 10, flexShrink: 0, marginLeft: 24 }}>
                  {!myQuote ? (
                    <button className="btn btn-primary" onClick={() => setSelectedRfq(rfq)}>Submit Quotation</button>
                  ) : rfq.status === 'Sent' ? (
                    <button className="btn btn-secondary" onClick={() => setSelectedRfq(rfq)}>Edit Quotation</button>
                  ) : (
                    <button className="btn btn-secondary" onClick={() => setSelectedRfq(rfq)}>View Quotation</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

const SubmitQuotation = ({ rfq, onBack }) => {
  const { quotations, setQuotations, rfqs, setRfqs, vendors, currentUser, showToast, addLog, addNotification } = useApp();
  const myVendorId = currentUser?.vendorId;
  const myVendor = vendors.find(v => v.id === myVendorId);
  const existingQuote = myVendorId ? quotations.find(q => q.rfqId === rfq.id && q.vendorId === myVendorId) : null;
  const canEdit = rfq.status === 'Sent';

  const [lineItems, setLineItems] = useState(existingQuote?.lineItems || rfq.lineItems.map(li => ({ ...li, unitPrice: li.estimatedPrice || 0, subtotal: (li.estimatedPrice || 0) * li.qty })));
  const [deliveryDate, setDeliveryDate] = useState(existingQuote?.deliveryDate || '');
  const [paymentTerms, setPaymentTerms] = useState(existingQuote?.paymentTerms || 'Net 30');
  const [validityPeriod, setValidityPeriod] = useState(existingQuote?.validityPeriod || '30 days');
  const [gstRate, setGstRate] = useState(existingQuote?.gstRate || 18);
  const [notes, setNotes] = useState(existingQuote?.notes || '');
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);
  const [confirmSubmit, setConfirmSubmit] = useState(false);

  const updateItem = (id, field, value) => {
    setLineItems(prev => prev.map(li => {
      if (li.id !== id) return li;
      const updated = { ...li, [field]: value };
      if (field === 'unitPrice' || field === 'qty') updated.subtotal = Number(updated.unitPrice || 0) * Number(updated.qty || 0);
      return updated;
    }));
  };

  const subtotal = lineItems.reduce((s, li) => s + (li.subtotal || 0), 0);
  const gstAmount = (subtotal * Number(gstRate)) / 100;
  const grandTotal = subtotal + gstAmount;

  const validate = () => {
    const e = {};
    if (lineItems.some(li => !li.unitPrice || li.unitPrice <= 0)) e.lineItems = 'All items must have a valid price';
    if (!deliveryDate) e.deliveryDate = 'Delivery date is required';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const saveQuotation = async (isDraft) => {
    if (!isDraft && !validate()) return;
    setSaving(true);
    await new Promise(r => setTimeout(r, 500));
    const quoteData = {
      id: existingQuote?.id || generateId('q'),
      rfqId: rfq.id, vendorId: myVendorId,
      vendorName: myVendor?.name || currentUser?.name || 'Vendor',
      lineItems, subtotal, gstRate: Number(gstRate), gstAmount, grandTotal,
      deliveryDate, paymentTerms, validityPeriod, notes,
      status: isDraft ? 'Submitted' : 'Submitted',
      submittedAt: new Date().toLocaleString('en-IN'),
    };
    if (existingQuote) {
      setQuotations(prev => prev.map(q => q.id === existingQuote.id ? quoteData : q));
      addLog('UPDATE', 'Quotation', quoteData.id, `Updated quotation for ${rfq.rfqNumber} — Total: ${formatCurrency(grandTotal)}`);
    } else {
      setQuotations(prev => [quoteData, ...prev]);
      addLog('CREATE', 'Quotation', quoteData.id, `Submitted quotation for ${rfq.rfqNumber} — Total: ${formatCurrency(grandTotal)}`);
      addNotification('quotation', `New quotation received from ${currentUser?.name} for ${rfq.rfqNumber}`, 'u2');
      addNotification('quotation', `New quotation received from ${currentUser?.name} for ${rfq.rfqNumber}`, 'u1');
    }
    // ── Auto-update RFQ status so Comparison page can pick it up ──────────
    setRfqs(prev => prev.map(r => {
      if (r.id !== rfq.id) return r;
      // Count quotes already submitted (including this new one)
      const existingCount = quotations.filter(q => q.rfqId === rfq.id && q.id !== quoteData.id).length;
      const totalNow = existingCount + 1;
      const vendorCount = r.vendors?.length || 1;
      if (r.status === 'Sent' || r.status === 'Draft') {
        // Mark as 'Quotations Received' as soon as ANY quote is received
        return { ...r, status: totalNow >= 1 ? 'Quotations Received' : 'Sent' };
      }
      return r;
    }));
    showToast(isDraft ? 'Quotation saved' : 'Quotation submitted successfully!', 'success');
    setSaving(false);
    setConfirmSubmit(false);
    onBack();
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
        <button className="btn btn-secondary" onClick={onBack}>← Back</button>

      {existingQuote && !canEdit && (
        <div style={{ marginBottom: 16, padding: '10px 16px', background: '#FEF3C7', border: '1px solid #FDE68A', borderRadius: 8, color: '#92400E', fontSize: 13 }}>
          ℹ This RFQ is no longer accepting new quotations. Showing your submitted quotation in read-only mode.
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 20 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {/* Line Items */}
          <div className="card">
            <div className="card-header"><span className="card-title">Line Items — Enter Your Pricing</span></div>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: 'var(--surface)' }}>
                    {['Item', 'Qty', 'Unit', 'Unit Price (₹) *', 'Subtotal'].map(h => <th key={h} style={{ padding: '10px 14px', textAlign: 'left', fontSize: 12, fontWeight: 600, color: 'var(--text-secondary)', borderBottom: '1px solid var(--border)' }}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {lineItems.map((li, i) => (
                    <tr key={li.id} style={{ background: i % 2 === 0 ? 'white' : 'var(--surface)' }}>
                      <td style={{ padding: '10px 14px' }}>
                        <div style={{ fontWeight: 500 }}>{li.name}</div>
                        {li.description && <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{li.description}</div>}

                      <td style={{ padding: '10px 14px' }}><span className="mono">{li.qty}</span></td>
                      <td style={{ padding: '10px 14px' }}>{li.unit}</td>
                      <td style={{ padding: '10px 6px' }}>
                        {canEdit || !existingQuote ? (
                          <input className="form-input mono" type="number" min="0" value={li.unitPrice} onChange={e => updateItem(li.id, 'unitPrice', Number(e.target.value))} style={{ width: 120 }} disabled={existingQuote && !canEdit} />

                      </td>
                      <td style={{ padding: '10px 14px', fontFamily: 'DM Mono, monospace', fontWeight: 500 }}>{formatCurrency(li.subtotal)}</td>
